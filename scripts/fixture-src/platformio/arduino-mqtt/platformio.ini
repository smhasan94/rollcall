; rollcall fixture source (SHA-131): an Arduino-ESP32 sketch with three registry libraries.
; Hand-written input, not build output: scripts/regen-fixtures-platformio.sh builds it with
; `pio run` and collects its metadata under fixtures/platformio/arduino-mqtt/. Every version
; is an exact pin; the script asserts each one after the build.

[platformio]
default_envs = esp32dev

; Settings every environment shares.
[env]
platform = espressif32 @ 6.10.0
platform_packages =
    platformio/framework-arduinoespressif32 @ 3.20017.241212
framework = arduino
monitor_speed = 115200

[common]
lib_deps =
    bblanchon/ArduinoJson @ 7.2.1
    knolleary/PubSubClient @ 2.8
    mathertel/OneButton @ 2.6.1

[env:esp32dev]
board = esp32dev
lib_deps = ${common.lib_deps}
build_flags = -DMQTT_MAX_PACKET_SIZE=512
