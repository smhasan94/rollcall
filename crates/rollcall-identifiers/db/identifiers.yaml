# rollcall identifier database: Zephyr module -> upstream project, purl, cpe and version.
#
# The schema is documented in the rollcall_core::identify module docs; the conventions (purl
# type, where CPEs come from, how versions are derived) in docs/identifiers.md.
#
# - purl: `pkg:generic/<upstream>@<version>?vcs_url=git+<upstream repository>`. None of these
#   C projects is published in a registry scanners index, so no registry type fits, and
#   `pkg:github` is avoided because osv-scanner reads it as the GitHub Actions ecosystem.
# - cpe: only where the NVD CPE dictionary lists the upstream's vendor:product (checked
#   2026-10-01 with scripts/nvd-spot-check.sh). No CPE is constructed for the rest; each such
#   module says why in a comment and in docs/identifiers.md.
# - cpe_aliases: other dictionary vendor:products NVD files the same project's CVEs under
#   (deprecated ones included); they become additional CPEs (syft:cpe23 properties).
# - version_rule: forks pinned by commit use `manual` tables. The rows between the
#   `# BEGIN generated` / `# END generated` markers are written only by
#   scripts/regen-version-tables.sh (Zephyr v4.2.0 to v4.4.2); hand-curated rows go outside
#   the markers and cite their source. Revisions and versions are quoted so a hex revision is
#   never read as a number.
# - db_version: this database's release, semver, always equal to the version of the
#   rollcall-identifiers crate (crates/rollcall-identifiers/Cargo.toml). Bump MINOR to add a
#   module, PATCH to fix an entry, MAJOR only with a schema change; see CONTRIBUTING.md.
schema: 1
db_version: '1.0.0'
modules:
