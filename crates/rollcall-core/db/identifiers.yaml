# rollcall identifier database: Zephyr module -> upstream project, purl, cpe and version.
#
# The schema is documented in the rollcall_core::identify module docs. This seed holds only
# the entries rollcall's own tests use; more modules are added separately.
schema: 1
modules:
  cmsis:
    upstream:
      name: CMSIS_5
      homepage: https://github.com/ARM-software/CMSIS_5
      supplier: Arm
    purl: pkg:github/ARM-software/CMSIS_5@{version}
    version_rule:
      kind: git_tag
      pattern: '^v?(?P<version>\d+\.\d+\.\d+)$'
  mbedtls:
    upstream:
      name: Mbed TLS
      homepage: https://github.com/Mbed-TLS/mbedtls
      supplier: arm
    purl: pkg:github/Mbed-TLS/mbedtls@v{version}
    cpe: cpe:2.3:a:arm:mbed_tls:{version}:*:*:*:*:*:*:*
    version_rule:
      kind: manual
      table:
        a3e190fe44c78d1ba67f55979e1257328cc7d0d8: 4.1.0
  tf-psa-crypto:
    upstream:
      name: TF-PSA-Crypto
      homepage: https://github.com/Mbed-TLS/TF-PSA-Crypto
      supplier: arm
    purl: pkg:github/Mbed-TLS/TF-PSA-Crypto@v{version}
    cpe: cpe:2.3:a:arm:tf-psa-crypto:{version}:*:*:*:*:*:*:*
    version_rule:
      kind: manual
      table:
        dc575a2ddcc8cb16275d24c42a52eaf79ebe2231: 1.1.0
