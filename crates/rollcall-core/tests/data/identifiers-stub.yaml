# Hand-written identifier database for the tests (not a real-build fixture; see README.md).
# It maps three of the six modules in fixtures/zephyr: cmsis_6, hal_nordic and mcuboot are
# deliberately left out, so the tests can check that exactly those are reported.
schema: 1
modules:
  cmsis:
    upstream:
      name: CMSIS_5
      homepage: https://github.com/ARM-software/CMSIS_5
      supplier: Arm
    purl: pkg:github/ARM-software/CMSIS_5@{version}
    version_rule:
      kind: git_tag
      pattern: '^v?(?P<version>\d+\.\d+\.\d+)$'
  mbedtls:
    upstream:
      name: Mbed TLS
      homepage: https://github.com/Mbed-TLS/mbedtls
      supplier: arm
    purl: pkg:github/Mbed-TLS/mbedtls@v{version}
    cpe: cpe:2.3:a:arm:mbed_tls:{version}:*:*:*:*:*:*:*
    version_rule:
      kind: manual
      table:
        a3e190fe44c78d1ba67f55979e1257328cc7d0d8: 4.1.0
  tf-psa-crypto:
    upstream:
      name: TF-PSA-Crypto
      homepage: https://github.com/Mbed-TLS/TF-PSA-Crypto
      supplier: arm
    purl: pkg:github/Mbed-TLS/TF-PSA-Crypto@v{version}
    cpe: cpe:2.3:a:arm:tf-psa-crypto:{version}:*:*:*:*:*:*:*
    version_rule:
      kind: manual
      table:
        dc575a2ddcc8cb16275d24c42a52eaf79ebe2231: 1.1.0
