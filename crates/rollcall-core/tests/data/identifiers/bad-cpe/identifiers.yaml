# Hand-written model fixture for the identifier-database lint and version tests (SHA-104),
# not from a real build; see tests/data/README.md. Module beta's cpe has too few components.
schema: 1
db_version: '1.0.0'
modules:
  alpha:
    upstream:
      name: Alpha
    purl: 'pkg:generic/alpha@{version}'
    version_rule:
      kind: manual
      table:
        'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa': '1.0.0'
  beta:
    upstream:
      name: Beta
    purl: 'pkg:generic/beta@{version}'
    cpe: 'cpe:2.3:a:beta:{version}:*:*'
    version_rule:
      kind: manual
      table:
        'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb': '1.0.0'
