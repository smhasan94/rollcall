[package]
name = "rollcall-core"
description = "Component-graph model and ingestion for rollcall"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
authors.workspace = true
keywords.workspace = true
# Categories are permanent once published; library crates are not command-line utilities.
categories = ["development-tools"]
# What the library needs to build: its sources and the files they include_str! (db, profiles,
# schemas, and the pins file the test-only seed module reads). The integration tests and their
# goldens read the repository's fixtures/, so they are not shipped (they could not run there).
include = [
    "src/**",
    "db/**",
    "profiles/**",
    "schema/**",
    "tests/data/zephyr-manifest-pins.txt",
]

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ed25519-dalek.workspace = true
packageurl.workspace = true
thiserror.workspace = true
jsonschema.workspace = true
time.workspace = true
yaml_serde.workspace = true
regex.workspace = true
semver.workspace = true
auditable-info.workspace = true
rollcall-identifiers.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
pulldown-cmark.workspace = true

[lints]
workspace = true
