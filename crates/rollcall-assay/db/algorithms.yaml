# The algorithm catalogue (SHA-139): rollcall's single source of truth for the classical and
# post-quantum security of the algorithms `rollcall assay` reports. Data, not code: see
# docs/catalogue.md for the schema, the risk classes, where every number comes from and how
# cbom-infra keeps its copy in sync. The JSON Schema is algorithms.schema.json beside it.
#
# Entries are in name order (ASCII, ignoring case); a parameter-set `id` is the CycloneDX
# parameterSetIdentifier and is always quoted.
format: rollcall-algorithms/1
algorithms:
  - name: AES-CBC
    family: AES
    primitive: block-cipher
    mode: cbc
    crypto_functions: [decrypt, encrypt]
    quantum_risk: grover-weakened
    standards: [FIPS 197, SP 800-38A]
    parameter_sets:
      - id: "128"
        classical_security_level: 128
        nist_quantum_security_level: 1
        oid: 2.16.840.1.101.3.4.1.2
        source: "SP 800-57 Pt 1 Rev 5 Table 2: AES-128 → 128 bits; NIST PQC CfP §4.A.5: category 1 is key search on AES-128"
      - id: "192"
        classical_security_level: 192
        nist_quantum_security_level: 3
        oid: 2.16.840.1.101.3.4.1.22
        source: "SP 800-57 Pt 1 Rev 5 Table 2: AES-192 → 192 bits; NIST PQC CfP §4.A.5: category 3 is key search on AES-192"
      - id: "256"
        classical_security_level: 256
        nist_quantum_security_level: 5
        oid: 2.16.840.1.101.3.4.1.42
        source: "SP 800-57 Pt 1 Rev 5 Table 2: AES-256 → 256 bits; NIST PQC CfP §4.A.5: category 5 is key search on AES-256"
  - name: AES-CCM
