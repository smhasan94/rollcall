    emit: [DH, RSA-PKCS1v15]
    reason: mbedTLS is built with the TLS 1.2 DHE-RSA key exchange (CONFIG_MBEDTLS_KEY_EXCHANGE_DHE_RSA_ENABLED)
  - id: kx-dhe-psk
