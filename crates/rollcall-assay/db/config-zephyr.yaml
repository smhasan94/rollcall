    when: [CONFIG_MBEDTLS_ECJPAKE_C]
    uncatalogued: [EC-JPAKE]

  # ---------------------------------------------------------------------------------------
  # nRF Connect SDK legacy mbedTLS crypto (nrf_security Kconfig.legacy, with
  # CONFIG_MBEDTLS_LEGACY_CRYPTO_C). These are mbedTLS's own MBEDTLS_*_C names, unlike the
  # Zephyr 3.x CONFIG_MBEDTLS_CIPHER_*_ENABLED ones; the names both trees share
  # (CONFIG_MBEDTLS_RSA_C, _PKCS1_V15/_V21, _ECDH_C, _ECDSA_C, _ECDSA_DETERMINISTIC, _ECP_DP_*,
  # _HKDF_C, _DHM_C, _ECJPAKE_C, _CTR_DRBG_C, _HMAC_DRBG_C) are mapped once, above.
  # Not mapped, because they choose padding, table sizes, a key-length limit or which backend
  # implements an algorithm rather than whether it is built: CONFIG_MBEDTLS_CIPHER_PADDING_*,
  # CONFIG_MBEDTLS_AES_ROM_TABLES/_FEWER_TABLES, CONFIG_MBEDTLS_AES_ONLY_128_BIT_KEY_LENGTH,
  # CONFIG_MBEDTLS_SHA256_SMALLER, CONFIG_MBEDTLS_512_SMALLER and every CONFIG_MBEDTLS_*_ALT.
  # ---------------------------------------------------------------------------------------
  - id: ncs-aes-cbc
    when: [CONFIG_MBEDTLS_AES_C, CONFIG_MBEDTLS_CIPHER_MODE_CBC]
    library: mbedtls
    emit: [AES-CBC]
    reason: mbedTLS is built with AES in CBC mode (CONFIG_MBEDTLS_AES_C, CONFIG_MBEDTLS_CIPHER_MODE_CBC)
  - id: ncs-aes-ctr
    when: [CONFIG_MBEDTLS_AES_C, CONFIG_MBEDTLS_CIPHER_MODE_CTR]
    library: mbedtls
    emit: [AES-CTR]
    reason: mbedTLS is built with AES in CTR mode (CONFIG_MBEDTLS_AES_C, CONFIG_MBEDTLS_CIPHER_MODE_CTR)
  - id: ncs-aes-xts
    when: [CONFIG_MBEDTLS_AES_C, CONFIG_MBEDTLS_CIPHER_MODE_XTS]
    uncatalogued: [AES-XTS]
  - id: ncs-aes-ccm
    when: [CONFIG_MBEDTLS_AES_C, CONFIG_MBEDTLS_CCM_C]
    library: mbedtls
    emit: [AES-CCM]
    reason: mbedTLS is built with AES-CCM (CONFIG_MBEDTLS_AES_C, CONFIG_MBEDTLS_CCM_C)
  - id: ncs-aes-gcm
    when: [CONFIG_MBEDTLS_AES_C, CONFIG_MBEDTLS_GCM_C]
    library: mbedtls
    emit: [AES-GCM]
    reason: mbedTLS is built with AES-GCM (CONFIG_MBEDTLS_AES_C, CONFIG_MBEDTLS_GCM_C)
  - id: ncs-cmac
    when: [CONFIG_MBEDTLS_CMAC_C]
    uncatalogued: [CMAC]
  - id: ncs-chachapoly
    when: [CONFIG_MBEDTLS_CHACHAPOLY_C]
    library: mbedtls
    emit: [ChaCha20-Poly1305-256]
    reason: mbedTLS is built with ChaCha20-Poly1305 (CONFIG_MBEDTLS_CHACHAPOLY_C)
  - id: ncs-chacha20
    when: [CONFIG_MBEDTLS_CHACHA20_C]
    uncatalogued: [ChaCha20]
  - id: ncs-md5
    when: [CONFIG_MBEDTLS_MD5_C]
    uncatalogued: [MD5]
  - id: ncs-sha1
    when: [CONFIG_MBEDTLS_SHA1_C]
    uncatalogued: [SHA-1]
  - id: ncs-sha224
    when: [CONFIG_MBEDTLS_SHA224_C]
    library: mbedtls
    emit: [SHA2-224]
    reason: mbedTLS is built with SHA-224 (CONFIG_MBEDTLS_SHA224_C)
  - id: ncs-sha256
    when: [CONFIG_MBEDTLS_SHA256_C]
    library: mbedtls
    emit: [SHA2-256]
    reason: mbedTLS is built with SHA-256 (CONFIG_MBEDTLS_SHA256_C)
  - id: ncs-sha384
    when: [CONFIG_MBEDTLS_SHA384_C]
    library: mbedtls
    emit: [SHA2-384]
    reason: mbedTLS is built with SHA-384 (CONFIG_MBEDTLS_SHA384_C)
  - id: ncs-sha512
    when: [CONFIG_MBEDTLS_SHA512_C]
    library: mbedtls
    emit: [SHA2-512]
    reason: mbedTLS is built with SHA-512 (CONFIG_MBEDTLS_SHA512_C)

  # ---------------------------------------------------------------------------------------
  # Bluetooth LE security (Zephyr host and controller).
  # ---------------------------------------------------------------------------------------
  - id: bt-smp-secure-connections
    when: [CONFIG_BT_SMP]
    unless: [CONFIG_BT_SMP_LEGACY_PAIR_ONLY]
    library: zephyr-bluetooth
    emit: [ECDH-secp256r1]
    uncatalogued: [AES-CMAC]
    reason: LE Secure Connections pairing uses ECDH on P-256 (CONFIG_BT_SMP)
  - id: bt-smp-legacy-pairing
    when: [CONFIG_BT_SMP]
    unless: [CONFIG_BT_SMP_SC_ONLY]
    library: zephyr-bluetooth
    emit: [AES-ECB-128]
    reason: LE legacy pairing uses the AES-128 block function e (CONFIG_BT_SMP without CONFIG_BT_SMP_SC_ONLY)
  - id: bt-ecc
    when: [CONFIG_BT_ECC]
    library: zephyr-bluetooth
    emit: [ECDH-secp256r1]
    reason: the Bluetooth host's ECC support runs ECDH on P-256 (CONFIG_BT_ECC)
  - id: bt-privacy
    when: [CONFIG_BT_PRIVACY]
    library: zephyr-bluetooth
    emit: [AES-ECB-128]
    reason: resolvable private addresses use the AES-128 hash function ah (CONFIG_BT_PRIVACY)
  - id: bt-host-crypto
    when: [CONFIG_BT_HOST_CRYPTO]
    library: zephyr-bluetooth
    emit: [AES-ECB-128]
    reason: the Bluetooth host provides AES-128 encryption itself (CONFIG_BT_HOST_CRYPTO)
  - id: bt-ctlr-le-enc
    when: [CONFIG_BT_CTLR_LE_ENC]
    library: zephyr-bluetooth
    emit:
      - {algorithm: AES-CCM, parameter_set: "128", hardware: true}
