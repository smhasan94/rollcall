  # TLS 1.2 key exchanges. CONFIG_MBEDTLS_KEY_EXCHANGE_* is not gated on TLS in Kconfig (Zephyr
  # 3.x Kconfig.tls-generic, Zephyr 4.4 Kconfig.mbedtls; MCUboot's mbedTLS sets one without TLS),
  # and mbedTLS 3.6 (config_adjust_ssl.h) drops every MBEDTLS_KEY_EXCHANGE_*_ENABLED when
  # MBEDTLS_SSL_PROTO_TLS1_2 is off: they are TLS 1.2 only. So each rule also needs TLS 1.2 on,
  # spelt CONFIG_MBEDTLS_SSL_PROTO_TLS1_2 (Zephyr 4.3 and later, and every nRF Connect SDK) or
  # CONFIG_MBEDTLS_TLS_VERSION_1_2 (Zephyr 3.x to 4.2).
  - id: kx-rsa
    when: [CONFIG_MBEDTLS_KEY_EXCHANGE_RSA_ENABLED]
    when_any: [CONFIG_MBEDTLS_SSL_PROTO_TLS1_2, CONFIG_MBEDTLS_TLS_VERSION_1_2]
    library: mbedtls
    emit: [RSA-PKCS1v15]
    reason: mbedTLS is built with the TLS 1.2 RSA key exchange (CONFIG_MBEDTLS_KEY_EXCHANGE_RSA_ENABLED)
  - id: kx-dhe-rsa
