  - id: bt-ctlr-ecdh
    when: [CONFIG_BT_CTLR_ECDH]
    library: zephyr-bluetooth
    emit: [ECDH-secp256r1]
    reason: the Bluetooth controller computes the LE Secure Connections ECDH on P-256 (CONFIG_BT_CTLR_ECDH)
  - id: bt-signing
    when: [CONFIG_BT_SIGNING]
    uncatalogued: [AES-CMAC]

