hardware:
  # nRF Connect SDK's nrf_security with the CryptoCell or CRACEN PSA driver runs these PSA
  # algorithms in the crypto accelerator. The driver symbols are nRF Connect SDK names.
  # CryptoCell-310/312 hashes only up to SHA-256 (nrf_security src/drivers/Kconfig,
  # PSA_USE_CC3XX_HASH_DRIVER: SHA-1, SHA-224, SHA-256), so only those sets are marked.
  - when: [CONFIG_NRF_SECURITY, CONFIG_PSA_CRYPTO_DRIVER_CC3XX]
    library: psa-crypto
    algorithms: [AES-CBC, AES-CCM, AES-CTR, AES-ECB, ECDH, ECDSA, HMAC-SHA-224, HMAC-SHA-256, SHA2-224, SHA2-256]
    reason: nRF Security runs this algorithm in the Arm CryptoCell accelerator (CONFIG_NRF_SECURITY, CONFIG_PSA_CRYPTO_DRIVER_CC3XX)
  - when: [CONFIG_NRF_SECURITY, CONFIG_PSA_CRYPTO_DRIVER_CRACEN]
    library: psa-crypto
    algorithms: [AES-CBC, AES-CCM, AES-CTR, AES-ECB, AES-GCM, ChaCha20-Poly1305, ECDH, ECDSA, Ed25519, HMAC, SHA2, SHA3, X25519]
    reason: nRF Security runs this algorithm in the CRACEN accelerator (CONFIG_NRF_SECURITY, CONFIG_PSA_CRYPTO_DRIVER_CRACEN)

compiled_out:
  # Each entry names the library the algorithms are compiled out of: psa-crypto for the
  # PSA_WANT symbols, mbedtls for mbedTLS's own module switches. A source finding under another
  # library is only down-weighted, never removed (see docs/assay-config.md).
  # PSA Crypto: a PSA_WANT symbol that is explicitly off.
  - {library: psa-crypto, when_all_off: [CONFIG_PSA_WANT_KEY_TYPE_AES], algorithms: [AES-CBC, AES-CCM, AES-CTR, AES-ECB, AES-GCM]}
  - {library: psa-crypto, when_all_off: [CONFIG_PSA_WANT_ALG_CBC_NO_PADDING, CONFIG_PSA_WANT_ALG_CBC_PKCS7], algorithms: [AES-CBC]}
  - {library: psa-crypto, when_all_off: [CONFIG_PSA_WANT_ALG_CCM], algorithms: [AES-CCM]}
  - {library: psa-crypto, when_all_off: [CONFIG_PSA_WANT_ALG_CTR], algorithms: [AES-CTR]}
  - {library: psa-crypto, when_all_off: [CONFIG_PSA_WANT_ALG_ECB_NO_PADDING], algorithms: [AES-ECB]}
  - {library: psa-crypto, when_all_off: [CONFIG_PSA_WANT_ALG_GCM], algorithms: [AES-GCM]}
  - {library: psa-crypto, when_all_off: [CONFIG_PSA_WANT_ALG_CHACHA20_POLY1305], algorithms: [ChaCha20-Poly1305]}
  - {library: psa-crypto, when_all_off: [CONFIG_PSA_WANT_ALG_ECDH], algorithms: [ECDH, X25519]}
  - {library: psa-crypto, when_all_off: [CONFIG_PSA_WANT_ALG_ECDSA, CONFIG_PSA_WANT_ALG_DETERMINISTIC_ECDSA], algorithms: [ECDSA]}
  - {library: psa-crypto, when_all_off: [CONFIG_PSA_WANT_ALG_FFDH], algorithms: [DH]}
  - {library: psa-crypto, when_all_off: [CONFIG_PSA_WANT_ALG_HKDF, CONFIG_PSA_WANT_ALG_HKDF_EXTRACT, CONFIG_PSA_WANT_ALG_HKDF_EXPAND], algorithms: [HKDF]}
  - {library: psa-crypto, when_all_off: [CONFIG_PSA_WANT_ALG_HMAC], algorithms: [HMAC]}
  - {library: psa-crypto, when_all_off: [CONFIG_PSA_WANT_ALG_PBKDF2_HMAC], algorithms: [PBKDF2]}
  - {library: psa-crypto, when_all_off: [CONFIG_PSA_WANT_ALG_RSA_OAEP], algorithms: [RSA-OAEP]}
  - {library: psa-crypto, when_all_off: [CONFIG_PSA_WANT_ALG_RSA_PKCS1V15_SIGN], algorithms: [RSA-PKCS1v15]}
  - {library: psa-crypto, when_all_off: [CONFIG_PSA_WANT_ALG_RSA_PSS], algorithms: [RSA-PSS]}
  - {library: psa-crypto, when_all_off: [CONFIG_PSA_WANT_ALG_SHA_224], algorithms: [SHA2-224]}
  - {library: psa-crypto, when_all_off: [CONFIG_PSA_WANT_ALG_SHA_256], algorithms: [SHA2-256]}
  - {library: psa-crypto, when_all_off: [CONFIG_PSA_WANT_ALG_SHA_384], algorithms: [SHA2-384]}
  - {library: psa-crypto, when_all_off: [CONFIG_PSA_WANT_ALG_SHA_512], algorithms: [SHA2-512]}
  - {library: psa-crypto, when_all_off: [CONFIG_PSA_WANT_ALG_SHA3_224], algorithms: [SHA3-224]}
  - {library: psa-crypto, when_all_off: [CONFIG_PSA_WANT_ALG_SHA3_256], algorithms: [SHA3-256]}
  - {library: psa-crypto, when_all_off: [CONFIG_PSA_WANT_ALG_SHA3_384], algorithms: [SHA3-384]}
  - {library: psa-crypto, when_all_off: [CONFIG_PSA_WANT_ALG_SHA3_512], algorithms: [SHA3-512]}
  - {library: psa-crypto, when_all_off: [CONFIG_PSA_WANT_ALG_SHAKE128], algorithms: [SHAKE-128]}
  - {library: psa-crypto, when_all_off: [CONFIG_PSA_WANT_ALG_SHAKE256], algorithms: [SHAKE-256]}
  # Legacy mbedTLS (Zephyr 3.x names, and the names both trees share): a module switch that is
  # explicitly off.
  - {library: mbedtls, when_all_off: [CONFIG_MBEDTLS_CIPHER_MODE_CBC_ENABLED], algorithms: [AES-CBC]}
  - {library: mbedtls, when_all_off: [CONFIG_MBEDTLS_CIPHER_MODE_CTR_ENABLED], algorithms: [AES-CTR]}
  - {library: mbedtls, when_all_off: [CONFIG_MBEDTLS_CIPHER_GCM_ENABLED], algorithms: [AES-GCM]}
  - {library: mbedtls, when_all_off: [CONFIG_MBEDTLS_CIPHER_CCM_ENABLED], algorithms: [AES-CCM]}
  - {library: mbedtls, when_all_off: [CONFIG_MBEDTLS_CIPHER_AES_ENABLED], algorithms: [AES-CBC, AES-CCM, AES-CTR, AES-ECB, AES-GCM]}
  - {library: mbedtls, when_all_off: [CONFIG_MBEDTLS_CIPHER_CHACHA20_ENABLED], algorithms: [ChaCha20-Poly1305]}
  - {library: mbedtls, when_all_off: [CONFIG_MBEDTLS_RSA_C], algorithms: [RSA-OAEP, RSA-PKCS1v15, RSA-PSS]}
  - {library: mbedtls, when_all_off: [CONFIG_MBEDTLS_ECP_C], algorithms: [ECDH, ECDSA, X25519]}
  - {library: mbedtls, when_all_off: [CONFIG_MBEDTLS_SHA224], algorithms: [SHA2-224]}
  - {library: mbedtls, when_all_off: [CONFIG_MBEDTLS_SHA256], algorithms: [SHA2-256]}
  - {library: mbedtls, when_all_off: [CONFIG_MBEDTLS_SHA384], algorithms: [SHA2-384]}
  - {library: mbedtls, when_all_off: [CONFIG_MBEDTLS_SHA512], algorithms: [SHA2-512]}
  - {library: mbedtls, when_all_off: [CONFIG_MBEDTLS_HKDF_C], algorithms: [HKDF]}
  - {library: mbedtls, when_all_off: [CONFIG_MBEDTLS_DHM_C], algorithms: [DH]}
  # Legacy mbedTLS (nRF Connect SDK names).
  - {library: mbedtls, when_all_off: [CONFIG_MBEDTLS_CIPHER_MODE_CBC], algorithms: [AES-CBC]}
  - {library: mbedtls, when_all_off: [CONFIG_MBEDTLS_AES_C], algorithms: [AES-CBC, AES-CCM, AES-CTR, AES-ECB, AES-GCM]}
  - {library: mbedtls, when_all_off: [CONFIG_MBEDTLS_CIPHER_MODE_CTR], algorithms: [AES-CTR]}
  - {library: mbedtls, when_all_off: [CONFIG_MBEDTLS_CCM_C], algorithms: [AES-CCM]}
  - {library: mbedtls, when_all_off: [CONFIG_MBEDTLS_GCM_C], algorithms: [AES-GCM]}
  - {library: mbedtls, when_all_off: [CONFIG_MBEDTLS_CHACHAPOLY_C], algorithms: [ChaCha20-Poly1305]}
  - {library: mbedtls, when_all_off: [CONFIG_MBEDTLS_SHA224_C], algorithms: [SHA2-224]}
  - {library: mbedtls, when_all_off: [CONFIG_MBEDTLS_SHA256_C], algorithms: [SHA2-256]}
  - {library: mbedtls, when_all_off: [CONFIG_MBEDTLS_SHA384_C], algorithms: [SHA2-384]}
  - {library: mbedtls, when_all_off: [CONFIG_MBEDTLS_SHA512_C], algorithms: [SHA2-512]}

custom_config:
  # A configuration header Kconfig does not generate can turn algorithms back on behind
  # Kconfig's back, so an image with one gets no mbedtls or psa-crypto compiled-out entries
  # (and a note). The defaults are the Kconfig-generated headers: config-tls-generic.h
  # (Zephyr 3.x to 4.1, CONFIG_MBEDTLS_CFG_FILE), config-mbedtls.h (Zephyr 4.2 and later),
  # config-tf-psa-crypto.h (Zephyr 4.4 TF-PSA-Crypto), and nRF Connect SDK nrf_security's
  # nrf-config.h, nrf-psa-crypto-config.h and nrf-psa-crypto-user-config.h (NCS 2.9 to 3.3 name
  # the PSA ones in CONFIG_MBEDTLS_PSA_CRYPTO_*CONFIG_FILE, NCS 3.4 in its
  # Kconfig.tf-psa-crypto.defconfig defaults for CONFIG_TF_PSA_CRYPTO_*CONFIG_FILE); an empty
  # CONFIG_MBEDTLS_CFG_FILE is Zephyr 4.4's unset deprecated alias.
  - {symbol: CONFIG_MBEDTLS_USER_CONFIG_FILE, defaults: [""], libraries: [mbedtls, psa-crypto]}
  - {symbol: CONFIG_MBEDTLS_CONFIG_FILE, defaults: [config-mbedtls.h, nrf-config.h], libraries: [mbedtls, psa-crypto]}
  - {symbol: CONFIG_MBEDTLS_CFG_FILE, defaults: ["", config-tls-generic.h, config-mbedtls.h, nrf-config.h], libraries: [mbedtls, psa-crypto]}
  - {symbol: CONFIG_TF_PSA_CRYPTO_CONFIG_FILE, defaults: [config-tf-psa-crypto.h, nrf-psa-crypto-config.h], libraries: [mbedtls, psa-crypto]}
  - {symbol: CONFIG_TF_PSA_CRYPTO_USER_CONFIG_FILE, defaults: ["", nrf-psa-crypto-user-config.h], libraries: [mbedtls, psa-crypto]}
  - {symbol: CONFIG_MBEDTLS_PSA_CRYPTO_CONFIG_FILE, defaults: [nrf-psa-crypto-config.h], libraries: [mbedtls, psa-crypto]}
  - {symbol: CONFIG_MBEDTLS_PSA_CRYPTO_USER_CONFIG_FILE, defaults: [nrf-psa-crypto-user-config.h], libraries: [mbedtls, psa-crypto]}
