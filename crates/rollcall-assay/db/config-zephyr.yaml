# Zephyr configuration rules for `rollcall assay --build` (SHA-144).
#
# Maps Kconfig symbols of a Zephyr image's zephyr/.config, and of a sysbuild top-level
# zephyr/.config (SB_CONFIG_*), to the algorithm catalogue (db/algorithms.yaml). Every algorithm
# and parameter set named here is checked against the catalogue by
# rollcall_assay::config::rules::RuleSet::lint; docs/assay-config.md explains the format.
#
# Sources of the symbol names: the fixtures under fixtures/zephyr*, the Zephyr 4.4
# modules/mbedtls and drivers/crypto Kconfig, the Zephyr subsys/bluetooth Kconfig, and MCUboot's
# boot/zephyr/Kconfig. The Zephyr 3.x legacy mbedTLS names keep the spelling of that release's
# modules/mbedtls/Kconfig.tls-generic; the nRF Connect SDK legacy names (MBEDTLS_AES_C, ...)
# that of NCS v3.1.0's subsys/nrf_security/Kconfig.legacy. The keelsign section is
# PROVISIONAL (see below).
format: rollcall-config-rules/1
detector: kconfig

api:
  psa:
    - CONFIG_MBEDTLS_PSA_CRYPTO_C
    - CONFIG_PSA_CRYPTO
    - CONFIG_NRF_SECURITY
  legacy:
    - CONFIG_MBEDTLS_RSA_C
    - CONFIG_MBEDTLS_ECP_C
    - CONFIG_MBEDTLS_ECDH_C
    - CONFIG_MBEDTLS_ECDSA_C
    - CONFIG_MBEDTLS_CIPHER_AES_ENABLED
    - CONFIG_MBEDTLS_SHA1
    - CONFIG_MBEDTLS_SHA224
    - CONFIG_MBEDTLS_SHA256
    - CONFIG_MBEDTLS_SHA384
    - CONFIG_MBEDTLS_SHA512
    - CONFIG_MBEDTLS_HKDF_C
    - CONFIG_MBEDTLS_DHM_C
    - CONFIG_MBEDTLS_LEGACY_CRYPTO_C
    - CONFIG_MBEDTLS_AES_C
    - CONFIG_MBEDTLS_SHA256_C

dimensions:
  ecdh-curve:
    - {symbol: CONFIG_PSA_WANT_ECC_SECP_R1_256, parameter_set: secp256r1}
    - {symbol: CONFIG_PSA_WANT_ECC_SECP_R1_384, parameter_set: secp384r1}
    - {symbol: CONFIG_PSA_WANT_ECC_SECP_R1_521, parameter_set: secp521r1}
    - {symbol: CONFIG_PSA_WANT_ECC_MONTGOMERY_255, algorithm: X25519, parameter_set: X25519}
    - {symbol: CONFIG_PSA_WANT_ECC_MONTGOMERY_448, uncatalogued: curve448}
    - {symbol: CONFIG_PSA_WANT_ECC_SECP_K1_256, uncatalogued: secp256k1}
    - {symbol: CONFIG_PSA_WANT_ECC_BRAINPOOL_P_R1_256, uncatalogued: brainpoolP256r1}
    - {symbol: CONFIG_PSA_WANT_ECC_BRAINPOOL_P_R1_384, uncatalogued: brainpoolP384r1}
    - {symbol: CONFIG_PSA_WANT_ECC_BRAINPOOL_P_R1_512, uncatalogued: brainpoolP512r1}
    - {symbol: CONFIG_MBEDTLS_ECP_DP_SECP256R1_ENABLED, parameter_set: secp256r1}
    - {symbol: CONFIG_MBEDTLS_ECP_DP_SECP384R1_ENABLED, parameter_set: secp384r1}
    - {symbol: CONFIG_MBEDTLS_ECP_DP_SECP521R1_ENABLED, parameter_set: secp521r1}
    - {symbol: CONFIG_MBEDTLS_ECP_DP_CURVE25519_ENABLED, algorithm: X25519, parameter_set: X25519}
    - {symbol: CONFIG_MBEDTLS_ECP_DP_SECP192R1_ENABLED, uncatalogued: secp192r1}
    - {symbol: CONFIG_MBEDTLS_ECP_DP_SECP224R1_ENABLED, uncatalogued: secp224r1}
    - {symbol: CONFIG_MBEDTLS_ECP_DP_SECP192K1_ENABLED, uncatalogued: secp192k1}
    - {symbol: CONFIG_MBEDTLS_ECP_DP_SECP224K1_ENABLED, uncatalogued: secp224k1}
    - {symbol: CONFIG_MBEDTLS_ECP_DP_SECP256K1_ENABLED, uncatalogued: secp256k1}
    - {symbol: CONFIG_MBEDTLS_ECP_DP_BP256R1_ENABLED, uncatalogued: brainpoolP256r1}
    - {symbol: CONFIG_MBEDTLS_ECP_DP_BP384R1_ENABLED, uncatalogued: brainpoolP384r1}
    - {symbol: CONFIG_MBEDTLS_ECP_DP_BP512R1_ENABLED, uncatalogued: brainpoolP512r1}
    - {symbol: CONFIG_MBEDTLS_ECP_DP_CURVE448_ENABLED, uncatalogued: curve448}
  ecdsa-curve:
    - {symbol: CONFIG_PSA_WANT_ECC_SECP_R1_256, parameter_set: secp256r1}
    - {symbol: CONFIG_PSA_WANT_ECC_SECP_R1_384, parameter_set: secp384r1}
    - {symbol: CONFIG_PSA_WANT_ECC_SECP_R1_521, parameter_set: secp521r1}
    - {symbol: CONFIG_PSA_WANT_ECC_SECP_K1_256, uncatalogued: secp256k1}
    - {symbol: CONFIG_PSA_WANT_ECC_BRAINPOOL_P_R1_256, uncatalogued: brainpoolP256r1}
    - {symbol: CONFIG_PSA_WANT_ECC_BRAINPOOL_P_R1_384, uncatalogued: brainpoolP384r1}
    - {symbol: CONFIG_PSA_WANT_ECC_BRAINPOOL_P_R1_512, uncatalogued: brainpoolP512r1}
    - {symbol: CONFIG_MBEDTLS_ECP_DP_SECP256R1_ENABLED, parameter_set: secp256r1}
    - {symbol: CONFIG_MBEDTLS_ECP_DP_SECP384R1_ENABLED, parameter_set: secp384r1}
    - {symbol: CONFIG_MBEDTLS_ECP_DP_SECP521R1_ENABLED, parameter_set: secp521r1}
    - {symbol: CONFIG_MBEDTLS_ECP_DP_SECP192R1_ENABLED, uncatalogued: secp192r1}
    - {symbol: CONFIG_MBEDTLS_ECP_DP_SECP224R1_ENABLED, uncatalogued: secp224r1}
    - {symbol: CONFIG_MBEDTLS_ECP_DP_SECP192K1_ENABLED, uncatalogued: secp192k1}
    - {symbol: CONFIG_MBEDTLS_ECP_DP_SECP224K1_ENABLED, uncatalogued: secp224k1}
    - {symbol: CONFIG_MBEDTLS_ECP_DP_SECP256K1_ENABLED, uncatalogued: secp256k1}
    - {symbol: CONFIG_MBEDTLS_ECP_DP_BP256R1_ENABLED, uncatalogued: brainpoolP256r1}
    - {symbol: CONFIG_MBEDTLS_ECP_DP_BP384R1_ENABLED, uncatalogued: brainpoolP384r1}
    - {symbol: CONFIG_MBEDTLS_ECP_DP_BP512R1_ENABLED, uncatalogued: brainpoolP512r1}
  dh-group:
    - {symbol: CONFIG_PSA_WANT_DH_RFC7919_2048, parameter_set: ffdhe2048}
    - {symbol: CONFIG_PSA_WANT_DH_RFC7919_3072, parameter_set: ffdhe3072}
    - {symbol: CONFIG_PSA_WANT_DH_RFC7919_4096, parameter_set: ffdhe4096}
    - {symbol: CONFIG_PSA_WANT_DH_RFC7919_6144, parameter_set: ffdhe6144}
    - {symbol: CONFIG_PSA_WANT_DH_RFC7919_8192, parameter_set: ffdhe8192}
  hmac-hash:
    - {symbol: CONFIG_PSA_WANT_ALG_SHA_224, parameter_set: SHA-224}
    - {symbol: CONFIG_PSA_WANT_ALG_SHA_256, parameter_set: SHA-256}
    - {symbol: CONFIG_PSA_WANT_ALG_SHA_384, parameter_set: SHA-384}
    - {symbol: CONFIG_PSA_WANT_ALG_SHA_512, parameter_set: SHA-512}
    - {symbol: CONFIG_PSA_WANT_ALG_SHA3_224, parameter_set: SHA3-224}
    - {symbol: CONFIG_PSA_WANT_ALG_SHA3_256, parameter_set: SHA3-256}
    - {symbol: CONFIG_PSA_WANT_ALG_SHA3_384, parameter_set: SHA3-384}
    - {symbol: CONFIG_PSA_WANT_ALG_SHA3_512, parameter_set: SHA3-512}
    - {symbol: CONFIG_PSA_WANT_ALG_SHA_1, uncatalogued: SHA-1}
    - {symbol: CONFIG_PSA_WANT_ALG_MD5, uncatalogued: MD5}
    - {symbol: CONFIG_PSA_WANT_ALG_RIPEMD160, uncatalogued: RIPEMD-160}
  hkdf-hash:
    - {symbol: CONFIG_PSA_WANT_ALG_SHA_256, parameter_set: SHA-256}
    - {symbol: CONFIG_PSA_WANT_ALG_SHA_384, parameter_set: SHA-384}
    - {symbol: CONFIG_PSA_WANT_ALG_SHA_512, parameter_set: SHA-512}
    - {symbol: CONFIG_PSA_WANT_ALG_SHA_1, uncatalogued: SHA-1}
    - {symbol: CONFIG_PSA_WANT_ALG_SHA_224, uncatalogued: SHA-224}
  pbkdf2-hash:
    - {symbol: CONFIG_PSA_WANT_ALG_SHA_256, parameter_set: HMAC-SHA-256}
    - {symbol: CONFIG_PSA_WANT_ALG_SHA_384, parameter_set: HMAC-SHA-384}
    - {symbol: CONFIG_PSA_WANT_ALG_SHA_512, parameter_set: HMAC-SHA-512}
    - {symbol: CONFIG_PSA_WANT_ALG_SHA_1, uncatalogued: HMAC-SHA-1}
    - {symbol: CONFIG_PSA_WANT_ALG_SHA_224, uncatalogued: HMAC-SHA-224}

rules:
  # ---------------------------------------------------------------------------------------
  # MCUboot (an image with CONFIG_MCUBOOT=y): image verification and encryption.
  # ---------------------------------------------------------------------------------------
  - id: mcuboot-signature-rsa
    when: [CONFIG_BOOT_SIGNATURE_TYPE_RSA]
    library: mcuboot
    emit:
      - {algorithm: RSA-PSS, parameter_set_from: {int: CONFIG_BOOT_SIGNATURE_TYPE_RSA_LEN}}
    reason: MCUboot verifies image signatures with RSA-PSS (CONFIG_BOOT_SIGNATURE_TYPE_RSA, key length CONFIG_BOOT_SIGNATURE_TYPE_RSA_LEN)
  - id: mcuboot-signature-ecdsa-p256
    when: [CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256]
    library: mcuboot
    emit: [ECDSA-secp256r1]
    reason: MCUboot verifies image signatures with ECDSA on P-256 (CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256)
  - id: mcuboot-signature-ed25519
    when: [CONFIG_BOOT_SIGNATURE_TYPE_ED25519]
    library: mcuboot
    emit: [Ed25519]
    reason: MCUboot verifies image signatures with Ed25519 (CONFIG_BOOT_SIGNATURE_TYPE_ED25519)
  - id: mcuboot-signature-pure
    when: [CONFIG_BOOT_SIGNATURE_TYPE_PURE]
    library: mcuboot
    emit: [Ed25519]
    reason: MCUboot verifies pure Ed25519 signatures over the whole image (CONFIG_BOOT_SIGNATURE_TYPE_PURE)
  - id: mcuboot-signature-none
    when: [CONFIG_BOOT_SIGNATURE_TYPE_NONE]
    note: MCUboot does not verify image signatures (CONFIG_BOOT_SIGNATURE_TYPE_NONE)
  - id: mcuboot-image-hash-sha256
    when: [CONFIG_BOOT_IMG_HASH_ALG_SHA256]
    library: mcuboot
    emit: [SHA2-256]
    reason: MCUboot hashes images with SHA-256 (CONFIG_BOOT_IMG_HASH_ALG_SHA256)
  - id: mcuboot-image-hash-sha384
    when: [CONFIG_BOOT_IMG_HASH_ALG_SHA384]
    library: mcuboot
    emit: [SHA2-384]
    reason: MCUboot hashes images with SHA-384 (CONFIG_BOOT_IMG_HASH_ALG_SHA384)
  - id: mcuboot-image-hash-sha512
    when: [CONFIG_BOOT_IMG_HASH_ALG_SHA512]
    library: mcuboot
    emit: [SHA2-512]
    reason: MCUboot hashes images with SHA-512 (CONFIG_BOOT_IMG_HASH_ALG_SHA512)
  - id: mcuboot-encrypt-rsa
    when: [CONFIG_BOOT_ENCRYPT_IMAGE, CONFIG_BOOT_ENCRYPT_RSA]
    library: mcuboot
    emit: [RSA-OAEP-2048]
    reason: MCUboot unwraps the image encryption key with RSA-OAEP 2048 (CONFIG_BOOT_ENCRYPT_RSA)
  - id: mcuboot-encrypt-ec256
    when: [CONFIG_BOOT_ENCRYPT_IMAGE, CONFIG_BOOT_ENCRYPT_EC256]
    library: mcuboot
    emit: [ECDH-secp256r1, HKDF-SHA-256, HMAC-SHA-256]
    reason: MCUboot derives the image encryption key by ECIES on P-256 with HKDF and HMAC-SHA-256 (CONFIG_BOOT_ENCRYPT_EC256)
  - id: mcuboot-encrypt-x25519
    when: [CONFIG_BOOT_ENCRYPT_IMAGE, CONFIG_BOOT_ENCRYPT_X25519]
    library: mcuboot
    emit: [X25519]
    reason: MCUboot derives the image encryption key by ECIES on X25519 (CONFIG_BOOT_ENCRYPT_X25519)
  - id: mcuboot-encrypt-x25519-default-hmac
    when: [CONFIG_BOOT_ENCRYPT_IMAGE, CONFIG_BOOT_ENCRYPT_X25519]
    unless: [CONFIG_BOOT_HMAC_SHA256, CONFIG_BOOT_HMAC_SHA512]
    library: mcuboot
    emit: [HKDF-SHA-256, HMAC-SHA-256]
    reason: MCUboot's X25519 key exchange uses HKDF and HMAC with SHA-256 by default
  - id: mcuboot-hmac-sha256
    when: [CONFIG_BOOT_ENCRYPT_IMAGE, CONFIG_BOOT_HMAC_SHA256]
    library: mcuboot
    emit: [HKDF-SHA-256, HMAC-SHA-256]
    reason: MCUboot's encryption key exchange uses HKDF and HMAC with SHA-256 (CONFIG_BOOT_HMAC_SHA256)
  - id: mcuboot-hmac-sha512
    when: [CONFIG_BOOT_ENCRYPT_IMAGE, CONFIG_BOOT_HMAC_SHA512]
    library: mcuboot
    emit: [HKDF-SHA-512, HMAC-SHA-512]
    reason: MCUboot's encryption key exchange uses HKDF and HMAC with SHA-512 (CONFIG_BOOT_HMAC_SHA512)
  - id: mcuboot-encrypt-aes-128
    when: [CONFIG_BOOT_ENCRYPT_IMAGE, CONFIG_BOOT_ENCRYPT_ALG_AES_128]
    library: mcuboot
    emit: [AES-CTR-128]
    reason: MCUboot decrypts images with AES-128 in CTR mode (CONFIG_BOOT_ENCRYPT_ALG_AES_128)
  - id: mcuboot-encrypt-aes-256
    when: [CONFIG_BOOT_ENCRYPT_IMAGE, CONFIG_BOOT_ENCRYPT_ALG_AES_256]
    library: mcuboot
    emit: [AES-CTR-256]
    reason: MCUboot decrypts images with AES-256 in CTR mode (CONFIG_BOOT_ENCRYPT_ALG_AES_256)
  - id: mcuboot-encrypt-aes-default
    when: [CONFIG_BOOT_ENCRYPT_IMAGE]
    unless: [CONFIG_BOOT_ENCRYPT_ALG_AES_128, CONFIG_BOOT_ENCRYPT_ALG_AES_256]
    library: mcuboot
    emit: [AES-CTR-128]
    reason: MCUboot decrypts images with AES-128 in CTR mode by default (CONFIG_BOOT_ENCRYPT_IMAGE)

  # Sysbuild (top-level zephyr/.config): the MCUboot signature type, as evidence on the
  # MCUboot image's signature asset.
  - id: sysbuild-signature-rsa
    when: [SB_CONFIG_BOOT_SIGNATURE_TYPE_RSA]
    library: mcuboot
    emit: [RSA-PSS]
    reason: sysbuild configures MCUboot for RSA-PSS image signatures (SB_CONFIG_BOOT_SIGNATURE_TYPE_RSA)
  - id: sysbuild-signature-ecdsa-p256
    when: [SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256]
    library: mcuboot
    emit: [ECDSA-secp256r1]
    reason: sysbuild configures MCUboot for ECDSA P-256 image signatures (SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256)
  - id: sysbuild-signature-ed25519
    when: [SB_CONFIG_BOOT_SIGNATURE_TYPE_ED25519]
    library: mcuboot
    emit: [Ed25519]
    reason: sysbuild configures MCUboot for Ed25519 image signatures (SB_CONFIG_BOOT_SIGNATURE_TYPE_ED25519)
  - id: sysbuild-signature-type-rsa
    when_value: {SB_CONFIG_SIGNATURE_TYPE: RSA}
    library: mcuboot
    emit: [RSA-PSS]
    reason: sysbuild signs images for MCUboot with RSA-PSS (SB_CONFIG_SIGNATURE_TYPE="RSA")
  - id: sysbuild-signature-type-ecdsa-p256
    when_value: {SB_CONFIG_SIGNATURE_TYPE: ECDSA_P256}
    library: mcuboot
    emit: [ECDSA-secp256r1]
    reason: sysbuild signs images for MCUboot with ECDSA P-256 (SB_CONFIG_SIGNATURE_TYPE="ECDSA_P256")
  - id: sysbuild-signature-type-ed25519
    when_value: {SB_CONFIG_SIGNATURE_TYPE: ED25519}
    library: mcuboot
    emit: [Ed25519]
    reason: sysbuild signs images for MCUboot with Ed25519 (SB_CONFIG_SIGNATURE_TYPE="ED25519")

  # ---------------------------------------------------------------------------------------
  # keelsign post-quantum signature TLVs for MCUboot. PROVISIONAL: these symbol names are
  # placeholders until keelsign's MCUboot integration fixes its Kconfig; see
  # docs/assay-config.md. TLV types: 0x4BA1 ML-DSA-44, 0x4BA2 ML-DSA-65, 0x4BA3 HSS/LMS.
  # ---------------------------------------------------------------------------------------
  - id: keelsign-mldsa44
    when: [CONFIG_BOOT_KEELSIGN_MLDSA44]
    library: mcuboot
    emit: [ML-DSA-44]
    reason: keelsign verifies an ML-DSA-44 image signature TLV 0x4BA1 (CONFIG_BOOT_KEELSIGN_MLDSA44, provisional name)
  - id: keelsign-mldsa65
    when: [CONFIG_BOOT_KEELSIGN_MLDSA65]
    library: mcuboot
    emit: [ML-DSA-65]
    reason: keelsign verifies an ML-DSA-65 image signature TLV 0x4BA2 (CONFIG_BOOT_KEELSIGN_MLDSA65, provisional name)
  - id: keelsign-lms-hss
    when: [CONFIG_BOOT_KEELSIGN_LMS_HSS]
    library: mcuboot
    emit:
      - {algorithm: HSS, parameter_set_from: {string: CONFIG_BOOT_KEELSIGN_LMS_PARAMETER_SET}}
    reason: keelsign verifies an HSS/LMS image signature TLV 0x4BA3 (CONFIG_BOOT_KEELSIGN_LMS_HSS, provisional name)

  # ---------------------------------------------------------------------------------------
  # PSA Crypto (Zephyr 4.x, TF-PSA-Crypto / mbedTLS 4): CONFIG_PSA_WANT_*.
  # ---------------------------------------------------------------------------------------
  - id: psa-aes-cbc-no-padding
    when: [CONFIG_PSA_WANT_ALG_CBC_NO_PADDING, CONFIG_PSA_WANT_KEY_TYPE_AES]
    library: psa-crypto
    emit: [AES-CBC]
    reason: PSA Crypto is built with AES in CBC mode (CONFIG_PSA_WANT_ALG_CBC_NO_PADDING, CONFIG_PSA_WANT_KEY_TYPE_AES)
  - id: psa-aes-cbc-pkcs7
    when: [CONFIG_PSA_WANT_ALG_CBC_PKCS7, CONFIG_PSA_WANT_KEY_TYPE_AES]
    library: psa-crypto
    emit: [AES-CBC]
    reason: PSA Crypto is built with AES in CBC mode with PKCS#7 padding (CONFIG_PSA_WANT_ALG_CBC_PKCS7)
  - id: psa-aes-ccm
    when: [CONFIG_PSA_WANT_ALG_CCM, CONFIG_PSA_WANT_KEY_TYPE_AES]
    library: psa-crypto
    emit: [AES-CCM]
    reason: PSA Crypto is built with AES-CCM (CONFIG_PSA_WANT_ALG_CCM, CONFIG_PSA_WANT_KEY_TYPE_AES)
  - id: psa-aes-ctr
    when: [CONFIG_PSA_WANT_ALG_CTR, CONFIG_PSA_WANT_KEY_TYPE_AES]
    library: psa-crypto
    emit: [AES-CTR]
    reason: PSA Crypto is built with AES in CTR mode (CONFIG_PSA_WANT_ALG_CTR, CONFIG_PSA_WANT_KEY_TYPE_AES)
  - id: psa-aes-ecb
    when: [CONFIG_PSA_WANT_ALG_ECB_NO_PADDING, CONFIG_PSA_WANT_KEY_TYPE_AES]
    library: psa-crypto
    emit: [AES-ECB]
    reason: PSA Crypto is built with AES in ECB mode (CONFIG_PSA_WANT_ALG_ECB_NO_PADDING, CONFIG_PSA_WANT_KEY_TYPE_AES)
  - id: psa-aes-gcm
    when: [CONFIG_PSA_WANT_ALG_GCM, CONFIG_PSA_WANT_KEY_TYPE_AES]
    library: psa-crypto
    emit: [AES-GCM]
    reason: PSA Crypto is built with AES-GCM (CONFIG_PSA_WANT_ALG_GCM, CONFIG_PSA_WANT_KEY_TYPE_AES)
  - id: psa-chacha20-poly1305
    when: [CONFIG_PSA_WANT_ALG_CHACHA20_POLY1305, CONFIG_PSA_WANT_KEY_TYPE_CHACHA20]
    library: psa-crypto
    emit: [ChaCha20-Poly1305-256]
    reason: PSA Crypto is built with ChaCha20-Poly1305 (CONFIG_PSA_WANT_ALG_CHACHA20_POLY1305)
  - id: psa-ecdh
    when: [CONFIG_PSA_WANT_ALG_ECDH]
    library: psa-crypto
    emit:
      - {algorithm: ECDH, parameter_set_from: {dimension: ecdh-curve}}
    reason: PSA Crypto is built with ECDH on each enabled curve (CONFIG_PSA_WANT_ALG_ECDH, CONFIG_PSA_WANT_ECC_*)
  - id: psa-ecdsa
    when: [CONFIG_PSA_WANT_ALG_ECDSA]
    library: psa-crypto
    emit:
      - {algorithm: ECDSA, parameter_set_from: {dimension: ecdsa-curve}}
    reason: PSA Crypto is built with ECDSA on each enabled curve (CONFIG_PSA_WANT_ALG_ECDSA, CONFIG_PSA_WANT_ECC_*)
  - id: psa-deterministic-ecdsa
    when: [CONFIG_PSA_WANT_ALG_DETERMINISTIC_ECDSA]
    library: psa-crypto
    emit:
      - {algorithm: ECDSA, parameter_set_from: {dimension: ecdsa-curve}}
    reason: PSA Crypto is built with deterministic ECDSA (CONFIG_PSA_WANT_ALG_DETERMINISTIC_ECDSA)
  - id: psa-ffdh
    when: [CONFIG_PSA_WANT_ALG_FFDH]
    library: psa-crypto
    emit:
      - {algorithm: DH, parameter_set_from: {dimension: dh-group}}
    reason: PSA Crypto is built with finite-field Diffie-Hellman (CONFIG_PSA_WANT_ALG_FFDH, CONFIG_PSA_WANT_DH_RFC7919_*)
  - id: psa-hkdf
    when: [CONFIG_PSA_WANT_ALG_HKDF]
    library: psa-crypto
    emit:
      - {algorithm: HKDF, parameter_set_from: {dimension: hkdf-hash}}
    reason: PSA Crypto is built with HKDF on each enabled hash (CONFIG_PSA_WANT_ALG_HKDF)
  - id: psa-hkdf-extract
    when: [CONFIG_PSA_WANT_ALG_HKDF_EXTRACT]
    library: psa-crypto
    emit:
      - {algorithm: HKDF, parameter_set_from: {dimension: hkdf-hash}}
    reason: PSA Crypto is built with HKDF-Extract (CONFIG_PSA_WANT_ALG_HKDF_EXTRACT)
  - id: psa-hkdf-expand
    when: [CONFIG_PSA_WANT_ALG_HKDF_EXPAND]
    library: psa-crypto
    emit:
      - {algorithm: HKDF, parameter_set_from: {dimension: hkdf-hash}}
    reason: PSA Crypto is built with HKDF-Expand (CONFIG_PSA_WANT_ALG_HKDF_EXPAND)
  - id: psa-hmac
    when: [CONFIG_PSA_WANT_ALG_HMAC]
    library: psa-crypto
    emit:
      - {algorithm: HMAC, parameter_set_from: {dimension: hmac-hash}}
    reason: PSA Crypto is built with HMAC on each enabled hash (CONFIG_PSA_WANT_ALG_HMAC, CONFIG_PSA_WANT_ALG_SHA_*)
  - id: psa-pbkdf2-hmac
    when: [CONFIG_PSA_WANT_ALG_PBKDF2_HMAC]
    library: psa-crypto
    emit:
      - {algorithm: PBKDF2, parameter_set_from: {dimension: pbkdf2-hash}}
    reason: PSA Crypto is built with PBKDF2-HMAC (CONFIG_PSA_WANT_ALG_PBKDF2_HMAC)
  - id: psa-rsa-oaep
    when: [CONFIG_PSA_WANT_ALG_RSA_OAEP]
    library: psa-crypto
    emit: [RSA-OAEP]
    reason: PSA Crypto is built with RSA-OAEP (CONFIG_PSA_WANT_ALG_RSA_OAEP)
  - id: psa-rsa-pkcs1v15-sign
    when: [CONFIG_PSA_WANT_ALG_RSA_PKCS1V15_SIGN]
    library: psa-crypto
    emit: [RSA-PKCS1v15]
    reason: PSA Crypto is built with RSA PKCS#1 v1.5 signatures (CONFIG_PSA_WANT_ALG_RSA_PKCS1V15_SIGN)
  - id: psa-rsa-pss
    when: [CONFIG_PSA_WANT_ALG_RSA_PSS]
    library: psa-crypto
    emit: [RSA-PSS]
    reason: PSA Crypto is built with RSA-PSS signatures (CONFIG_PSA_WANT_ALG_RSA_PSS)
  - id: psa-sha-224
    when: [CONFIG_PSA_WANT_ALG_SHA_224]
    library: psa-crypto
    emit: [SHA2-224]
    reason: PSA Crypto is built with SHA-224 (CONFIG_PSA_WANT_ALG_SHA_224)
  - id: psa-sha-256
    when: [CONFIG_PSA_WANT_ALG_SHA_256]
    library: psa-crypto
    emit: [SHA2-256]
