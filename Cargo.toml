[workspace]
resolver = "3"
members = [
    "crates/rollcall-core",
    "crates/rollcall-assay",
    "crates/rollcall-identifiers",
    "crates/rollcall",
]

[workspace.package]
version = "0.1.0-rc.1"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
repository = "https://github.com/smhasan94/rollcall"
readme = "README.md"
authors = ["Sharukh Hasan"]
keywords = ["sbom", "cyclonedx", "firmware", "zephyr", "cra"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
assert_cmd = "2.2"
predicates = "3.1"
toml = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["pem", "zeroize"] }
packageurl = "0.7"
thiserror = "2.0"
proptest = { version = "1.11", default-features = false, features = ["std"] }
jsonschema = { version = "0.58.2", default-features = false }
time = { version = "0.3.55", default-features = false, features = ["std", "formatting", "parsing"] }
tempfile = "3"
yaml_serde = "0.10"
regex = "1.13"
semver = "1.0"
pulldown-cmark = { version = "0.13", default-features = false }
# The reference reader of the `.dep-v0` section `cargo auditable` embeds (SHA-127).
auditable-info = { version = "0.10.1", default-features = false }
rollcall-core = { path = "crates/rollcall-core", version = "0.1.0-rc.1" }
rollcall-assay = { path = "crates/rollcall-assay", version = "0.1.0-rc.1" }
# Versioned on its own: its version is the identifier database's db_version.
rollcall-identifiers = { path = "crates/rollcall-identifiers", version = "1.0.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

# The release binaries (.github/workflows/release.yml, docs/release.md): `cargo build
# --profile dist`. `cargo install rollcall` uses the plain release profile.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"
