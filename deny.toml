[graph]
all-features = true

[advisories]
ignore = []
yanked = "deny"

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    # MIT-0: borrow-or-share (via jsonschema's fluent-uri); Zlib: foldhash (via hashbrown).
    "MIT-0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
