cmake:
  application:
    source-dir: '/zephyrproject/zephyr/share/sysbuild'
  board:
    name: 'nrf52840dk'
    path:
     - '/zephyrproject/zephyr/boards/nordic/nrf52840dk'
    qualifiers: 'nrf52840'
    revision: ''
  images:
   - name: 'http_server'
     source-dir: '/zephyrproject/zephyr/samples/net/sockets/http_server'
     type: 'MAIN'
   - name: 'mcuboot'
     source-dir: '/zephyrproject/bootloader/mcuboot/boot/zephyr'
     type: 'BOOTLOADER'
  kconfig:
    files:
     - '/zephyrproject/build/tls/_sysbuild/empty.conf'
     - '/zephyrproject/build/tls/_sysbuild/empty.conf'
     - '/zephyrproject/build/tls/zephyr/misc/generated/extra_kconfig_options.conf'
    user-files:
     - '/zephyrproject/build/tls/_sysbuild/empty.conf'
  sysbuild: 'true'
version: '0.1.0'
west:
  command: '/zephyrproject/.venv/bin/west build -b nrf52840dk/nrf52840 --sysbuild -d build/tls zephyr/samples/net/sockets/http_server -- -DSB_CONFIG_BOOTLOADER_MCUBOOT=y -DEXTRA_CONF_FILE=overlay-usbd.conf;overlay-tls.conf -DEXTRA_DTC_OVERLAY_FILE=usbd_cdc_ncm.overlay -DCONFIG_BUILD_OUTPUT_META=y -Dmcuboot_CONFIG_BUILD_OUTPUT_META=y'
  topdir: '/zephyrproject'
  version: '1.5.0'
