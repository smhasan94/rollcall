cmake:
  application:
    source-dir: '/zephyrproject/zephyr/share/sysbuild'
  board:
    name: 'nrf52840dk'
    path:
     - '/zephyrproject/zephyr/boards/nordic/nrf52840dk'
    qualifiers: 'nrf52840'
    revision: ''
  images:
   - name: 'mbedtls'
     source-dir: '/zephyrproject/zephyr/tests/crypto/mbedtls'
     type: 'MAIN'
   - name: 'mcuboot'
     source-dir: '/zephyrproject/bootloader/mcuboot/boot/zephyr'
     type: 'BOOTLOADER'
  kconfig:
    files:
     - '/zephyrproject/build/old-mbedtls/_sysbuild/empty.conf'
     - '/zephyrproject/build/old-mbedtls/_sysbuild/empty.conf'
     - '/zephyrproject/build/old-mbedtls/zephyr/misc/generated/extra_kconfig_options.conf'
    user-files:
     - '/zephyrproject/build/old-mbedtls/_sysbuild/empty.conf'
  sysbuild: 'true'
version: '0.1.0'
west:
  command: '/zephyrproject/.venv/bin/west build -b nrf52840dk/nrf52840 --sysbuild -d build/old-mbedtls zephyr/tests/crypto/mbedtls -- -DSB_CONFIG_BOOTLOADER_MCUBOOT=y -DCONFIG_BUILD_OUTPUT_META=y -Dmcuboot_CONFIG_BUILD_OUTPUT_META=y'
  topdir: '/zephyrproject'
  version: '1.5.0'
