cmake:
  application:
    source-dir: '/zephyrproject/zephyr/share/sysbuild'
  board:
    name: 'nrf52840dk'
    path:
     - '/zephyrproject/zephyr/boards/nordic/nrf52840dk'
    qualifiers: 'nrf52840'
    revision: ''
  images:
   - name: 'smp_svr'
     source-dir: '/zephyrproject/zephyr/samples/subsys/mgmt/mcumgr/smp_svr'
     type: 'MAIN'
   - name: 'mcuboot'
     source-dir: '/zephyrproject/bootloader/mcuboot/boot/zephyr'
     type: 'BOOTLOADER'
  kconfig:
    files:
     - '/zephyrproject/build/smp-serial/_sysbuild/empty.conf'
     - '/zephyrproject/zephyr/samples/subsys/mgmt/mcumgr/smp_svr/sysbuild.conf'
    user-files:
     - '/zephyrproject/zephyr/samples/subsys/mgmt/mcumgr/smp_svr/sysbuild.conf'
  sysbuild: 'true'
version: '0.1.0'
west:
  command: '/zephyrproject/.venv/bin/west build -b nrf52840dk/nrf52840 --sysbuild -d build/smp-serial zephyr/samples/subsys/mgmt/mcumgr/smp_svr -- -DEXTRA_CONF_FILE=serial.conf -DCONFIG_BUILD_OUTPUT_META=y -Dmcuboot_CONFIG_BUILD_OUTPUT_META=y'
  topdir: '/zephyrproject'
  version: '1.5.0'
