name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: "-D warnings"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features --locked

  # grype and osv-scanner (pinned, SHA-256-verified) must load the generated CycloneDX
  # documents without warnings, and find nothing in the minimal fixture. Needs the network.
  smoke:
    runs-on: ubuntu-latest
    env:
      ROLLCALL_SMOKE_OUT: .cache/smoke
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p rollcall-cli --locked
      # One retry: the tool downloads, grype's database and osv.dev are all network calls.
      - name: Smoke scan (grype, osv-scanner)
        run: scripts/smoke-scan.sh --install || { echo "smoke-scan failed; retrying once"; scripts/smoke-scan.sh --install; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-scan
          path: ${{ env.ROLLCALL_SMOKE_OUT }}
          if-no-files-found: warn
