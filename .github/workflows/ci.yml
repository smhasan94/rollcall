name: CI

on:
  push:
    branches: [main]
    # Release tags too, so `cargo deny check` and `cargo doc` with -D warnings are recorded for
    # the tagged commit (SHA-125).
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: "-D warnings"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with rust-toolchain.toml. The Cargo ingestion tests run `cargo metadata`
      # and `cargo tree` for thumbv7em-none-eabihf (SHA-127).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      # Every fixture's `rollcall report --format json` against docs/report-schema.json
      # (also run by the step above; named here so a schema failure is visible on its own).
      - name: Report schema
        run: cargo test -p rollcall-core --test report json_validates_against_schema_for_every_fixture --locked
      # Every fixture with captured findings exported with `rollcall csaf` and checked against
      # the vendored CSAF 2.0 schema (with the CVSS schemas it references) and rollcall's
      # CSAF mandatory checks, offline (SHA-132; also run by the step above).
      - name: CSAF schema
        run: cargo test -p rollcall-core --test csaf csaf_validates_against_schema_for_every_fixture --locked
      # Offline checks of the identifier-database version-table generator.
      - run: python3 scripts/version-tables.py --self-test
      # Offline checks of the docs site's link preprocessor (SHA-125).
      - run: python3 scripts/mdbook-repo-links.py --self-test

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # v2.1.1 runs cargo-deny 0.20.2 (the `deny_version` its Dockerfile pins). Run the same
      # locally with `cargo deny --all-features --locked check`.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features --locked

  # The PyPI wrapper's tests (python/tests: download, checksum, cache and exec, against a
  # local HTTP server; SHA-124) on every platform it supports, with the oldest and a current
  # Python. Run the same locally with `python3 -m pytest python/tests`.
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --disable-pip-version-check "pytest==8.4.2"
      - run: python -m pytest python/tests

  # What the release workflow's preflight job checks, on every change (SHA-124): the versions
  # agree (scripts/release-version.sh), every crate packages and builds as it would be
  # published, and the wrapper's wheel and sdist build.
  publish-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Keep in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.91.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: scripts/release-version.sh check
      - run: cargo publish --workspace --dry-run --locked
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.8.4"
          enable-cache: false
      - run: uv build python --out-dir pydist

  # The identifier database lint (scripts/lint-identifiers.sh, offline): schema, purl and CPE
  # syntax, duplicate and unsorted modules, db_version equal to the rollcall-identifiers crate
  # version, every manual-table row resolving, and every module of the fixtures/zephyr builds
  # resolving to a purl. Then the release tarball: packaged twice with identical SHA-256s,
  # and read back from a cache directory. Run the same locally with
  # `scripts/lint-identifiers.sh` and `scripts/check-identifiers-package.sh`.
  identifiers-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
      - uses: Swatinem/rust-cache@v2
      - run: scripts/lint-identifiers.sh
      - run: scripts/check-identifiers-package.sh

  # The worked examples of docs/vex-rules.md (SHA-115), the gap analysis in
  # docs/zephyr-gaps.md (SHA-134) and the quickstart (SHA-125): every `$ ` command in a
  # ```console block runs and must print exactly the output shown under it. Offline. Run the
  # same locally with
  # `scripts/check-doc-examples.sh docs/vex-rules.md docs/zephyr-gaps.md docs/esp-idf.md docs/platformio.md docs/README.md docs/zephyr.md docs/cargo.md docs/quickstart.md`.
  docs-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p rollcall --locked
      - run: ROLLCALL_BIN=target/debug/rollcall scripts/check-doc-examples.sh docs/vex-rules.md docs/zephyr-gaps.md docs/esp-idf.md docs/platformio.md docs/README.md docs/zephyr.md docs/cargo.md docs/quickstart.md
      # The starter VEX rule pack's Kconfig symbols all exist in the real builds' .config files.
      - name: Lint the starter VEX rule pack
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r config; do
            args+=(--kconfig "$config")
          done < <(find fixtures -path '*/zephyr/.config' | sort)
          target/debug/rollcall vex lint --starter-rules --lint-starter-symbols "${args[@]}"

  # Every link in docs/zephyr-gaps.md and the outreach drafts in docs/outreach/ (SHA-134),
  # and in the getting-started pages, the FAQ and the release documents (SHA-125): links
  # inside the repository must exist (with their #anchors), and http(s) links must answer 2xx
  # or 3xx. Needs the network. Run the same locally with
  # `scripts/check-doc-links.sh docs/zephyr-gaps.md docs/outreach/*.md docs/quickstart.md docs/faq-cra-cisa.md docs/contributing-identifiers.md`
  # (`--offline` checks only the links inside the repository). Network-dependent: an external
  # site that is down fails this job, and re-running it is the remedy.
  #
  # Hosts that answer 403 to GitHub's runners only (scripts/link-check-blocked-hosts.txt,
  # each with its reason and date) give SKIP for a 403, and only for a 403.
  #
  # The release documents link pages that exist only after the release's human steps (the
  # v0.1.0 tag, the example repository, the live docs site), so their http(s) links are
  # checked on release tags only; their links inside the repository on every run.
  docs-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the gap analysis and outreach links
        run: scripts/check-doc-links.sh docs/zephyr-gaps.md docs/outreach/*.md
      - name: Check the quickstart, FAQ and contribution guide links
        run: scripts/check-doc-links.sh docs/quickstart.md docs/faq-cra-cisa.md docs/contributing-identifiers.md
      - name: Check the release documents' links inside the repository
        run: scripts/check-doc-links.sh --offline docs/ci.md docs/versioning.md docs/releases/*.md docs/README.md docs/SUMMARY.md README.md CHANGELOG.md SECURITY.md
      # On the tag's own run, release.yml has not created the GitHub Release yet, so the
      # CHANGELOG's link to it (releases/tag/<this tag>) still 404s. That one 404, and nothing
      # else, is tolerated: scripts/tolerate-pending-release-link.sh (tested in
      # crates/rollcall-core/tests/docs.rs). The docs site's link check covers the page later.
      # Pre-release tags (any `-`, e.g. v0.1.0-rc.1) skip this step: the release documents
      # describe the final release, so they link its release page (releases/tag/v0.1.0), the
      # docs site and the example repository, none of which exist yet on an rc's run.
      - name: Check the release documents' links (release tags)
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        run: |
          set -uo pipefail
          rc=0
          scripts/check-doc-links.sh docs/ci.md docs/versioning.md docs/releases/*.md \
            docs/README.md CHANGELOG.md SECURITY.md > "$RUNNER_TEMP/release-links.txt" || rc=$?
          cat "$RUNNER_TEMP/release-links.txt"
          scripts/tolerate-pending-release-link.sh "$GITHUB_REF_NAME" "$rc" "$RUNNER_TEMP/release-links.txt"

  # crates/rollcall-core/db/subsystems.yaml against the pinned Zephyr tree (every source path
  # and Kconfig symbol real, `size` claims backed). Needs the network on a cache miss.
  subsystems:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
      - uses: Swatinem/rust-cache@v2
      - name: Read the Zephyr pin
        id: pin
        run: echo "commit=$(python3 -c 'import json; print(json.load(open("fixtures/zephyr/MANIFEST.json"))["zephyr"]["commit"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .cache/zephyr-workspace/zephyr
          key: zephyr-tree-${{ steps.pin.outputs.commit }}
      # On a cache miss the script clones the pinned tag (retrying the clone once).
      - name: Verify the subsystem table
        run: scripts/verify-subsystems.sh

  # Every readiness-report Markdown golden (crates/rollcall-core/tests/golden/report/*.md)
  # rendered by GitHub's own Markdown renderer (POST /markdown, mode gfm): one H1, every
  # section heading, and every pipe table rendered as a table. Needs the network.
  report-markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render the report goldens with GitHub's renderer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/check-report-markdown.sh
      - name: Render the pull-request comment goldens with GitHub's renderer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/check-report-markdown.sh --comment

  # grype and osv-scanner (pinned, SHA-256-verified) must load the generated CycloneDX
  # documents without warnings, and find nothing in the minimal fixture. Needs the network.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p rollcall --locked
      # One retry: the tool downloads, grype's database and osv.dev are all network calls.
      # Each attempt writes to its own directory, so the first attempt's logs survive.
      - name: Smoke scan (grype, osv-scanner)
        run: |
          ROLLCALL_SMOKE_OUT=.cache/smoke-attempt-1 scripts/smoke-scan.sh --install || {
            echo "smoke-scan failed; retrying once"
            ROLLCALL_SMOKE_OUT=.cache/smoke-attempt-2 scripts/smoke-scan.sh --install
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-scan
          path: |
            .cache/smoke-attempt-1
            .cache/smoke-attempt-2
          if-no-files-found: warn

  # grype (pinned, SHA-256-verified) on the old-mbedTLS Zephyr build, enriched with the seed
  # identifier database must report every CVE in its expected list
  # (crates/rollcall-core/tests/data/old-mbedtls-expected-cves.txt) for the real Zephyr v4.2.0
  # build in fixtures/zephyr-old-mbedtls/. Needs the network.
  grype-expected-cves:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p rollcall --locked
      # One retry, as in the smoke job; each attempt keeps its own logs.
      - name: grype expected CVEs (old mbedTLS)
        run: |
          ROLLCALL_SMOKE_OUT=.cache/grype-cves-attempt-1 scripts/smoke-scan.sh --install --only old-mbedtls || {
            echo "grype expected-CVE check failed; retrying once"
            ROLLCALL_SMOKE_OUT=.cache/grype-cves-attempt-2 scripts/smoke-scan.sh --install --only old-mbedtls
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grype-expected-cves
          path: |
            .cache/grype-cves-attempt-1
            .cache/grype-cves-attempt-2
          if-no-files-found: warn

  # grype (pinned, SHA-256-verified) on the SBOM rollcall generates from the real
  # `cargo auditable` build in fixtures/cargo-old-heapless/ (heapless 0.5.6) must report every
  # advisory in crates/rollcall-core/tests/data/cargo-old-heapless-expected-advisories.txt, and
  # osv-scanner must report them too (SHA-127). Needs the network.
  grype-cargo-advisory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p rollcall --locked
      # One retry, as in the smoke job; each attempt keeps its own logs.
      - name: grype expected advisories (old heapless)
        run: |
          ROLLCALL_SMOKE_OUT=.cache/grype-cargo-attempt-1 scripts/smoke-scan.sh --install --only cargo-old-heapless || {
            echo "grype expected-advisory check failed; retrying once"
            ROLLCALL_SMOKE_OUT=.cache/grype-cargo-attempt-2 scripts/smoke-scan.sh --install --only cargo-old-heapless
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grype-cargo-advisory
          path: |
            .cache/grype-cargo-attempt-1
            .cache/grype-cargo-attempt-2
          if-no-files-found: warn

  # `rollcall scan` against the pinned grype 0.119.0 and osv-scanner 2.6.0 (SHA-256-verified,
  # installed by scripts/smoke-scan.sh --install): the grype/osv-scanner overlap on every
  # fixture SBOM, the known CVE set of the old-mbedTLS Zephyr build, then an offline scan with
  # --db-path while the network is blocked. Needs the network up to the block.
  scan:
    runs-on: ubuntu-latest
    env:
      ROLLCALL_TOOLS_DIR: ${{ github.workspace }}/.cache/tools
      GRYPE_DB_CACHE_DIR: ${{ github.workspace }}/.cache/grype-db
      ROLLCALL_SCAN_DB_DIR: ${{ github.workspace }}/.cache/scan-db
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p rollcall --locked
      - name: Install the pinned scanners
        run: |
          ROLLCALL_SMOKE_OUT=.cache/scan-install scripts/smoke-scan.sh --install --only minimal || {
            echo "install failed; retrying once"
            ROLLCALL_SMOKE_OUT=.cache/scan-install scripts/smoke-scan.sh --install --only minimal
          }
      - name: Scanner integration tests (online)
        run: cargo test -p rollcall --locked --test scan_scanners -- --ignored --skip offline
      # Everything the offline test needs is fetched or built while the network is up: both
      # databases (osv-scanner's for the ecosystems of the SBOM it will scan) and the test
      # binary.
      - name: Prime the offline databases and build the offline test
        id: prime
        run: |
          set -euo pipefail
          export PATH="$ROLLCALL_TOOLS_DIR:$PATH"
          v=fixtures/zephyr-old-mbedtls/old-mbedtls
          target/debug/rollcall generate --zephyr "$v/mbedtls" --west-list "$v/west-list.txt" \
            --identifier-db crates/rollcall-identifiers/db/identifiers.yaml \
            --timestamp 2026-01-02T03:04:05Z -o .cache/scan-old-mbedtls.cdx.json
          GRYPE_DB_CACHE_DIR="$ROLLCALL_SCAN_DB_DIR/grype" grype db update
          rc=0
          OSV_SCANNER_LOCAL_DB_CACHE_DIRECTORY="$ROLLCALL_SCAN_DB_DIR/osv-scanner" \
            osv-scanner scan source -L .cache/scan-old-mbedtls.cdx.json --format json \
            --offline-vulnerabilities --download-offline-databases >/dev/null || rc=$?
          test "$rc" -le 1
          bin="$(cargo test -p rollcall --locked --test scan_scanners --no-run --message-format=json |
            jq -r 'select(.profile.test == true and .target.name == "scan_scanners") | .executable')"
          test -x "$bin"
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
      # The block is scoped to processes whose group is `nonet`, so the runner itself keeps
      # its connection to GitHub: iptables/ip6tables reject all their output except
      # loopback (TCP with a reset, so a connection fails at once rather than timing out),
      # and curl run the same way proves it before the test runs. curl must fail with exit 7
      # (could not connect) and nothing else: any other failure (setpriv, the group, DNS)
      # proves nothing about the block. A reset is never a timeout, so 28 is not accepted.
      - name: Offline scan with --db-path and the network blocked
        env:
          TEST_BIN: ${{ steps.prime.outputs.bin }}
        run: |
          set -euo pipefail
          sudo groupadd --force nonet
          for ipt in iptables ip6tables; do
            sudo "$ipt" -I OUTPUT 1 -m owner --gid-owner nonet ! -o lo -j REJECT
            sudo "$ipt" -I OUTPUT 1 -m owner --gid-owner nonet ! -o lo -p tcp \
              -j REJECT --reject-with tcp-reset
          done
          offline() {
            sudo env PATH="$PATH" HOME="$HOME" ROLLCALL_TOOLS_DIR="$ROLLCALL_TOOLS_DIR" \
              ROLLCALL_SCAN_DB_DIR="$ROLLCALL_SCAN_DB_DIR" \
              setpriv --reuid="$(id -u)" --regid=nonet --clear-groups -- "$@"
          }
          # The same setpriv context can run a command at all.
          offline true
          for url in https://api.osv.dev https://grype.anchore.io https://github.com; do
            rc=0
            offline curl -sS --max-time 20 -o /dev/null "$url" || rc=$?
            if [ "$rc" -ne 7 ]; then
              echo "network block not proven for $url: curl exit $rc (want 7, could not connect)"
              exit 1
            fi
            echo "blocked: $url (curl exit 7)"
          done
          offline "$TEST_BIN" --ignored --exact offline_db_path_scan_without_network

  # `rollcall csaf` output for every fixture with captured findings against the official CSAF
  # validator library (@secvisogram/csaf-validator-lib 2.1.6, pinned with integrity hashes in
  # scripts/csaf-validator/package-lock.json): the strict CSAF 2.0 schema and every
  # mandatory test, plus a negative control that must fail (SHA-132). Needs the network for
  # `npm ci`. Run the same locally with `scripts/csaf-check.sh --install`.
  csaf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cargo build -p rollcall --locked
      - name: CSAF check (official validator)
        run: scripts/csaf-check.sh --install
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: csaf-check
          path: .cache/csaf
          if-no-files-found: warn

  # rollcall's VEX output against the reference tooling (SHA-113): vexctl (pinned,
  # SHA-256-verified) loads and validates every OpenVEX statement, the CycloneDX VEX
  # document validates against the CycloneDX 1.6 schema, and grype --vex suppresses the
  # old-mbedTLS findings marked not_affected. Needs the network.
  vex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p rollcall --locked
      # One retry, as in the smoke job; each attempt keeps its own logs.
      - name: VEX check (vexctl, CycloneDX schema, grype --vex)
        run: |
          ROLLCALL_VEX_OUT=.cache/vex-check-attempt-1 scripts/vex-check.sh --install || {
            echo "vex-check failed; retrying once"
            ROLLCALL_VEX_OUT=.cache/vex-check-attempt-2 scripts/vex-check.sh --install
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vex-check
          path: |
            .cache/vex-check-attempt-1
            .cache/vex-check-attempt-2
          if-no-files-found: warn

  # Sigstore keyless signing of a VEX document (`rollcall vex --sign cosign`) and its
  # verification, including a tampered copy that must fail. Keyless signing needs the
  # workflow's OIDC token, which GitHub grants only to trusted events, so both jobs run on
  # push only (not on pull requests, which may come from forks). The token is confined to a
  # minimal job: vex-cosign-build compiles rollcall without it and hands over the binary as
  # an artifact; vex-cosign runs no build, no cache and no unpinned action, and every action
  # in it is pinned to a full commit SHA.
  vex-cosign-build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p rollcall --locked
      - uses: actions/upload-artifact@v4
        with:
          name: rollcall-vex-cosign-bin
          path: target/debug/rollcall
          if-no-files-found: error
          retention-days: 1

  vex-cosign:
    if: github.event_name == 'push'
    needs: vex-cosign-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The installer verifies the cosign binary against checksums pinned in the action.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rollcall-vex-cosign-bin
          path: .cache/bin
      - name: Sign with cosign, verify, and reject a tampered copy
        run: |
          set -euo pipefail
          rollcall=.cache/bin/rollcall
          chmod +x "$rollcall"
          data=crates/rollcall-core/tests/data
          out=.cache/vex-cosign
          mkdir -p "$out"
          "$rollcall" vex --model "$data/old-mbedtls.model.json" \
            --kconfig fixtures/zephyr/tls/http_server/zephyr/.config \
            --findings "$data/findings/old-mbedtls.grype.json" \
            --rules "$data/vex/old-mbedtls.rules.yml" \
            --format openvex --author rollcall-ci --sign cosign -o "$out/vex.openvex.json"
          test -s "$out/vex.openvex.json.sigstore.json"
          verify() {
            "$rollcall" vex verify "$1" --cosign --bundle "$out/vex.openvex.json.sigstore.json" \
              --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          }
          verify "$out/vex.openvex.json"
          # Flip one bit of one byte of a copy.
          python3 -c 'import sys; b = bytearray(open(sys.argv[1], "rb").read()); b[100] ^= 1; open(sys.argv[2], "wb").write(b)' \
            "$out/vex.openvex.json" "$out/tampered.json"
          rc=0
          verify "$out/tampered.json" || rc=$?
          echo "tampered document: exit $rc"
          test "$rc" -eq 1
