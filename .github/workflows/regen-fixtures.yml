name: Regenerate Zephyr fixtures

# Rebuilds the Zephyr fixtures from their pinned releases on a clean runner (see
# docs/fixtures.md), one job per pin set: fixtures/zephyr (artifact `zephyr-fixtures`),
# fixtures/zephyr-old-mbedtls (artifact `zephyr-old-mbedtls-fixtures`) and fixtures/zephyr-smp
# (artifact `zephyr-smp-fixtures`), and the Cargo fixtures fixtures/cargo-* (job regen-cargo,
# artifact `cargo-fixtures`, scripts/regen-fixtures-cargo.sh), and the ESP-IDF fixtures
# fixtures/esp-idf (job regen-esp-idf, artifact `esp-idf-fixtures`,
# scripts/regen-fixtures-esp-idf.sh), and the PlatformIO fixture fixtures/platformio (job
# regen-platformio, artifact `platformio-fixtures`, scripts/regen-fixtures-platformio.sh).
# The uploaded artifacts
# are the canonical fixture sets: they are downloaded and committed by hand, never pushed by
# this workflow.

on:
  workflow_dispatch:
    inputs:
      check_stable:
        description: "Build everything twice and require identical output (--check-stable)"
        type: boolean
        default: true
  pull_request:
    paths:
      - scripts/regen-fixtures.sh
      - scripts/regen-fixtures-cargo.sh
      - scripts/regen-fixtures-esp-idf.sh
      - scripts/regen-fixtures-platformio.sh
      - scripts/fixture-src/**
      - .github/workflows/regen-fixtures.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  regen:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - set: main
            out: fixtures/zephyr
            variant_args: ""
            artifact: zephyr-fixtures
          - set: old-mbedtls
            out: fixtures/zephyr-old-mbedtls
            variant_args: "--variant old-mbedtls"
            artifact: zephyr-old-mbedtls-fixtures
          - set: smp
            out: fixtures/zephyr-smp
            variant_args: "--variant smp-serial --variant smp-bt"
            artifact: zephyr-smp-fixtures
    env:
      FIXTURES_OUT: ${{ matrix.out }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build gperf xz-utils file

      - name: Disk space before
        run: df -h

      # Keep in sync with rust-toolchain.toml; the script ends with `cargo test`.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
      - uses: Swatinem/rust-cache@v2

      - name: Keep a copy of the committed fixtures
        run: |
          mkdir -p "$RUNNER_TEMP/committed"
          if [[ -d "$FIXTURES_OUT" ]]; then
            cp -R "$FIXTURES_OUT" "$RUNNER_TEMP/committed/tree"
          fi

      - name: Regenerate fixtures
        env:
          CHECK_STABLE: ${{ github.event_name != 'workflow_dispatch' || inputs.check_stable }}
          VARIANT_ARGS: ${{ matrix.variant_args }}
        run: |
          args=()
          # Word-split on purpose: "--variant old-mbedtls" is two arguments.
          # shellcheck disable=SC2206
          [[ -z "$VARIANT_ARGS" ]] || args+=($VARIANT_ARGS)
          if [[ "$CHECK_STABLE" == true ]]; then
            args+=(--check-stable)
          fi
          scripts/regen-fixtures.sh "${args[@]}"

      # Informational only: a pin bump, or fixtures committed from another host, is expected to
      # change the path-dependent files. The step always succeeds; the result is in the summary.
      - name: Compare with the committed fixtures
        continue-on-error: true
        run: |
          mkdir -p regen-reports
          report=regen-reports/compare-committed.txt
          if [[ ! -d "$RUNNER_TEMP/committed/tree" ]]; then
            echo "No committed fixtures to compare with." | tee "$report"
            echo "No committed fixtures to compare with." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          rc=0
          scripts/regen-fixtures.sh compare "$RUNNER_TEMP/committed/tree" "$FIXTURES_OUT" \
            >"$report" 2>&1 || rc=$?
          cat "$report"
          {
            echo "### Regenerated $FIXTURES_OUT vs committed"
            echo
            if [[ "$rc" -eq 0 ]]; then
              echo "**PASS**: matches the committed fixtures (apart from the masked fields)."
            else
              echo "**FAIL** (informational, exit $rc): differs from the committed fixtures:"
              echo
              echo '```'
              grep -E '^FAIL|^ +[<>]' "$report" | head -100 || true
              echo '```'
            fi
          } >>"$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Collect reports and logs
        if: always()
        run: |
          mkdir -p regen-reports
          cp .cache/fixtures-staging/compare-stable.txt regen-reports/ 2>/dev/null || true
          cp -R .cache/fixtures-logs regen-reports/logs 2>/dev/null || true
          df -h

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.out }}
          if-no-files-found: error
          include-hidden-files: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.artifact }}-reports
          path: regen-reports
          if-no-files-found: warn

  # The Cargo fixtures (SHA-127): real `cargo auditable` builds of keelsign's nrf52840-hello and
  # the hand-written projects in scripts/fixture-src/, for thumbv7em-none-eabihf. The script
  # installs its pinned tools (cargo-auditable, rust-audit-info, flip-link) and clones keelsign
  # at its pinned commit. This runner's artifact is canonical.
  regen-cargo:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with rust-toolchain.toml and RUST_TOOLCHAIN in the script.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate Cargo fixtures
        env:
          CHECK_STABLE: ${{ github.event_name != 'workflow_dispatch' || inputs.check_stable }}
          # Explicit, for the record: the script runs cargo-auditable by its bare name, so
          # the tools path does not reach the output (--check-stable proves it with a copy
          # elsewhere).
          ROLLCALL_CARGO_TOOLS: ${{ github.workspace }}/.cache/tools
        run: |
          args=()
          if [[ "$CHECK_STABLE" == true ]]; then
            args+=(--check-stable)
          fi
          scripts/regen-fixtures-cargo.sh "${args[@]}"
      - name: Compare with the committed fixtures
        continue-on-error: true
        run: |
          {
            echo "### Regenerated fixtures/cargo-* vs committed"
            echo
            if git diff --quiet --exit-code -- fixtures; then
              echo "**PASS**: byte-identical to the committed fixtures."
            else
              echo "**DIFFERENT** (informational):"
              echo
              echo '```'
              git status --short -- fixtures | head -50
              echo '```'
            fi
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Collect reports and logs
        if: always()
        run: |
          mkdir -p regen-reports
          cp .cache/cargo-fixtures-staging/compare-stable.txt regen-reports/ 2>/dev/null || true
          cp -R .cache/cargo-fixtures-logs regen-reports/logs 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-fixtures
          path: |
            fixtures/cargo-keelsign
            fixtures/cargo-deps
            fixtures/cargo-old-heapless
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cargo-fixtures-reports
          path: regen-reports
          if-no-files-found: warn

  # The ESP-IDF fixtures (SHA-129): hello_world and https_request built for esp32 in the
  # espressif/idf image the script pins by digest (about 12 GB unpacked, so its own job; the
  # runner's preinstalled toolchains are removed first to make room). The builds need no
  # network beyond the image pull. This runner's artifact is canonical.
  regen-esp-idf:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for the ESP-IDF image
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h
      # Keep in sync with rust-toolchain.toml; the script ends with `cargo test`.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate ESP-IDF fixtures
        env:
          CHECK_STABLE: ${{ github.event_name != 'workflow_dispatch' || inputs.check_stable }}
        run: |
          args=(--remove-image)
          if [[ "$CHECK_STABLE" == true ]]; then
            args+=(--check-stable)
          fi
          scripts/regen-fixtures-esp-idf.sh "${args[@]}"
      - name: Compare with the committed fixtures
        continue-on-error: true
        run: |
          {
            echo "### Regenerated fixtures/esp-idf vs committed"
            echo
            if git diff --quiet --exit-code -- fixtures/esp-idf && \
               [[ -z "$(git status --porcelain -- fixtures/esp-idf)" ]]; then
              echo "**PASS**: byte-identical to the committed fixtures."
            else
              echo "**DIFFERENT** (informational):"
              echo
              echo '```'
              git status --short -- fixtures/esp-idf | head -50
              echo '```'
            fi
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Collect reports and logs
        if: always()
        run: |
          mkdir -p regen-reports
          cp .cache/esp-idf-fixtures-staging/compare-stable.txt regen-reports/ 2>/dev/null || true
          cp -R .cache/esp-idf-fixtures-logs regen-reports/logs 2>/dev/null || true
          df -h
      - uses: actions/upload-artifact@v4
        with:
          name: esp-idf-fixtures
          path: fixtures/esp-idf
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: esp-idf-fixtures-reports
          path: regen-reports
          if-no-files-found: warn

  # The PlatformIO fixture (SHA-131): `pio run -e esp32dev` of the hand-written Arduino-ESP32
  # project in scripts/fixture-src/platformio/, in the python image the script pins by digest
  # (linux/amd64), with PlatformIO Core installed from hash-pinned wheels. The build downloads
  # the platform, toolchain, framework and libraries from the PlatformIO registry. The fixture
  # holds hidden files (.pio/, .piopm), so the upload includes them. This runner's artifact is
  # canonical.
  regen-platformio:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with rust-toolchain.toml; the script ends with `cargo test`.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate the PlatformIO fixture
        env:
          CHECK_STABLE: ${{ github.event_name != 'workflow_dispatch' || inputs.check_stable }}
        run: |
          args=(--remove-image)
          if [[ "$CHECK_STABLE" == true ]]; then
            args+=(--check-stable)
          fi
          scripts/regen-fixtures-platformio.sh "${args[@]}"
      - name: Compare with the committed fixtures
        continue-on-error: true
        run: |
          {
            echo "### Regenerated fixtures/platformio vs committed"
            echo
            if git diff --quiet --exit-code -- fixtures/platformio && \
               [[ -z "$(git status --porcelain -- fixtures/platformio)" ]]; then
              echo "**PASS**: byte-identical to the committed fixtures."
            else
              echo "**DIFFERENT** (informational):"
              echo
              echo '```'
              git status --short -- fixtures/platformio | head -50
              echo '```'
            fi
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Collect reports and logs
        if: always()
        run: |
          mkdir -p regen-reports
          cp .cache/platformio-fixtures-staging/compare-stable.txt regen-reports/ 2>/dev/null || true
          cp -R .cache/platformio-fixtures-logs regen-reports/logs 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: platformio-fixtures
          path: fixtures/platformio
          if-no-files-found: error
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platformio-fixtures-reports
          path: regen-reports
          if-no-files-found: warn
