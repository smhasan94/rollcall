name: Regenerate Zephyr fixtures

# Rebuilds the Zephyr fixtures from their pinned releases on a clean runner (see
# docs/fixtures.md), one job per pin set: fixtures/zephyr (artifact `zephyr-fixtures`),
# fixtures/zephyr-old-mbedtls (artifact `zephyr-old-mbedtls-fixtures`) and fixtures/zephyr-smp
# (artifact `zephyr-smp-fixtures`). The uploaded artifacts
# are the canonical fixture sets: they are downloaded and committed by hand, never pushed by
# this workflow.

on:
  workflow_dispatch:
    inputs:
      check_stable:
        description: "Build everything twice and require identical output (--check-stable)"
        type: boolean
        default: true
  pull_request:
    paths:
      - scripts/regen-fixtures.sh
      - .github/workflows/regen-fixtures.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  regen:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - set: main
            out: fixtures/zephyr
            variant_args: ""
            artifact: zephyr-fixtures
          - set: old-mbedtls
            out: fixtures/zephyr-old-mbedtls
            variant_args: "--variant old-mbedtls"
            artifact: zephyr-old-mbedtls-fixtures
          - set: smp
            out: fixtures/zephyr-smp
            variant_args: "--variant smp-serial --variant smp-bt"
            artifact: zephyr-smp-fixtures
    env:
      FIXTURES_OUT: ${{ matrix.out }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build gperf xz-utils file

      - name: Disk space before
        run: df -h

      # Keep in sync with rust-toolchain.toml; the script ends with `cargo test`.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
      - uses: Swatinem/rust-cache@v2

      - name: Keep a copy of the committed fixtures
        run: |
          mkdir -p "$RUNNER_TEMP/committed"
          if [[ -d "$FIXTURES_OUT" ]]; then
            cp -R "$FIXTURES_OUT" "$RUNNER_TEMP/committed/tree"
          fi

      - name: Regenerate fixtures
        env:
          CHECK_STABLE: ${{ github.event_name != 'workflow_dispatch' || inputs.check_stable }}
          VARIANT_ARGS: ${{ matrix.variant_args }}
        run: |
          args=()
          # Word-split on purpose: "--variant old-mbedtls" is two arguments.
          # shellcheck disable=SC2206
          [[ -z "$VARIANT_ARGS" ]] || args+=($VARIANT_ARGS)
          if [[ "$CHECK_STABLE" == true ]]; then
            args+=(--check-stable)
          fi
          scripts/regen-fixtures.sh "${args[@]}"

      # Informational only: a pin bump, or fixtures committed from another host, is expected to
      # change the path-dependent files. The step always succeeds; the result is in the summary.
      - name: Compare with the committed fixtures
        continue-on-error: true
        run: |
          mkdir -p regen-reports
          report=regen-reports/compare-committed.txt
          if [[ ! -d "$RUNNER_TEMP/committed/tree" ]]; then
            echo "No committed fixtures to compare with." | tee "$report"
            echo "No committed fixtures to compare with." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          rc=0
          scripts/regen-fixtures.sh compare "$RUNNER_TEMP/committed/tree" "$FIXTURES_OUT" \
            >"$report" 2>&1 || rc=$?
          cat "$report"
          {
            echo "### Regenerated $FIXTURES_OUT vs committed"
            echo
            if [[ "$rc" -eq 0 ]]; then
              echo "**PASS**: matches the committed fixtures (apart from the masked fields)."
            else
              echo "**FAIL** (informational, exit $rc): differs from the committed fixtures:"
              echo
              echo '```'
              grep -E '^FAIL|^ +[<>]' "$report" | head -100 || true
              echo '```'
            fi
          } >>"$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Collect reports and logs
        if: always()
        run: |
          mkdir -p regen-reports
          cp .cache/fixtures-staging/compare-stable.txt regen-reports/ 2>/dev/null || true
          cp -R .cache/fixtures-logs regen-reports/logs 2>/dev/null || true
          df -h

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.out }}
          if-no-files-found: error
          include-hidden-files: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.artifact }}-reports
          path: regen-reports
          if-no-files-found: warn
