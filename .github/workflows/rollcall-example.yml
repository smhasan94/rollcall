# rollcall-action on this repository's own build fixtures: the in-repo stand-in for an
# example firmware repository (SHA-122). Each job runs the action from this checkout
# (`uses: ./action`, rollcall built from source):
#
# - zephyr: the Zephyr v4.4.2 sysbuild TLS build (fixtures/zephyr/tls), failing on new
#   findings at or above high;
# - cargo:  the keelsign Rust firmware (fixtures/cargo-keelsign, captured cargo metadata),
#   failing only on new critical findings;
# - platformio: the Arduino-ESP32 MQTT sketch (fixtures/platformio/arduino-mqtt, three
#   lib_deps) with `ecosystem: auto` (SHA-131), with `fail-on: none`: the fixture pins
#   Arduino-ESP32 2.0.17 (the newest PlatformIO's espressif32 platform ships), which has open
#   CVEs, so the job proves the PlatformIO pipeline and CPE-based scanning rather than a clean
#   bill. A check step then asserts the action detected PlatformIO, that the SBOM names the
#   framework and the three libraries, that the scan reports open findings on arduino-esp32,
#   and that the gate (which fail-on none never trips) is clean.
#
# On a push to main each job uploads its artifact (rollcall-zephyr, rollcall-cargo,
# rollcall-platformio); on a pull
# request each job diffs against main's latest artifact of the same name, posts or updates
# one comment, and fails on new findings at or above its fail-on. Before this workflow has run
# on main there is no base artifact, and every open finding counts as new.
#
# To see the gate trip, point a branch's build-dir at fixtures/zephyr-old-mbedtls/old-mbedtls
# (Mbed TLS 3.6.4) and fixtures/cargo-old-heapless (heapless 0.5.6): the zephyr job goes red
# naming the new CVEs; the cargo job stays green but lists heapless's high advisory.
name: rollcall example

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  zephyr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./action
        with:
          build-dir: fixtures/zephyr/tls
          fail-on: high
          artifact-name: rollcall-zephyr

  cargo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./action
        with:
          build-dir: fixtures/cargo-keelsign
          fail-on: critical
          artifact-name: rollcall-cargo

  platformio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./action
        id: rollcall
        with:
          build-dir: fixtures/platformio/arduino-mqtt
          ecosystem: auto
          # Arduino-ESP32 2.0.17 has open CVEs (grype matches them through the
          # espressif:arduino-esp32 CPE). This job proves the PlatformIO pipeline and CPE-based
          # scanning, not a clean bill, so it reports the findings without failing on them.
          fail-on: none
          artifact-name: rollcall-platformio
      - name: Check the PlatformIO SBOM, scan and gate
        env:
          ECOSYSTEM: ${{ steps.rollcall.outputs.ecosystem }}
          SBOM: ${{ steps.rollcall.outputs.sbom }}
          SCAN: ${{ steps.rollcall.outputs.scan }}
          GATE: ${{ steps.rollcall.outputs.gate }}
        run: |
          set -euo pipefail
          echo "ecosystem: $ECOSYSTEM"
          [[ "$ECOSYSTEM" == platformio ]] || { echo "::error::detected $ECOSYSTEM, not platformio"; exit 1; }
          purls="$(jq -r '.. | objects | select(has("purl")) | .purl' "$SBOM" | sort)"
          echo "$purls"
          for purl in \
            'pkg:generic/bblanchon/ArduinoJson@7.2.1?repository_url=https:%2F%2Fregistry.platformio.org' \
            'pkg:generic/knolleary/PubSubClient@2.8?repository_url=https:%2F%2Fregistry.platformio.org' \
            'pkg:generic/mathertel/OneButton@2.6.1?repository_url=https:%2F%2Fregistry.platformio.org' \
            'pkg:generic/arduino-esp32@2.0.17?vcs_url=git%2Bhttps:%2F%2Fgithub.com%2Fespressif%2Farduino-esp32'; do
            grep -qxF "$purl" <<<"$purls" || { echo "::error::$purl is not in the SBOM"; exit 1; }
          done
          jq -e '[.components[0].components[] | select(.type == "framework" and .name == "arduino-esp32" and .version == "2.0.17")] | length == 1' "$SBOM"
          # The scan reports open findings on the framework (no CVE ids pinned: the grype
          # database changes), and fail-on none leaves the gate clean.
          open="$(jq '[.findings[] | select(.component.name == "arduino-esp32" and .triage != "suppressed")] | length' "$SCAN")"
          echo "open findings on arduino-esp32: $open"
          [[ "$open" -ge 1 ]] || { echo "::error::no open finding on arduino-esp32 in $SCAN"; exit 1; }
          [[ "$GATE" == clean ]] || { echo "::error::gate is $GATE, expected clean with fail-on none"; exit 1; }
